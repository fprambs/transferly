# Test stack. One command per suite; see the Makefile.
#   docker compose -f compose.test.yaml run --rm unit    # backend and frontend tests with coverage
#   docker compose -f compose.test.yaml run --rm e2e     # browser tests against the production image
name: sentinel-test

x-user: &user
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

# vsftpd servers of the testenv profile, for the tests that need a real FTP server (profile ftp).
x-vsftpd: &vsftpd
  init: true
  build:
    context: testenv/vsftpd
  image: sentinel-testenv-vsftpd

services:
  postgres:
    image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 2s
      timeout: 3s
      retries: 30

  unit:
    <<: *user
    profiles: ["unit"]
    build:
      context: .
      dockerfile: docker/tools.Dockerfile
    image: sentinel-dev-tools
    working_dir: /workspace
    command: sh -c "./scripts/coverage-go.sh && cd frontend && pnpm install --frozen-lockfile && pnpm typecheck && pnpm lint && pnpm test:coverage"
    environment:
      CI: "true"
      SENTINEL_TEST_DATABASE_URL: postgres://sentinel:sentinel@postgres:5432/sentinel_test?sslmode=disable
    volumes:
      - .:/workspace
      - cache:/cache
    depends_on:
      postgres:
        condition: service_healthy

  ftp:
    profiles: ["ftp"]
    <<: *vsftpd
    environment:
      TZ: America/Santiago
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/21'"]
      interval: 3s
      timeout: 3s
      retries: 20

  ftps:
    profiles: ["ftp"]
    <<: *vsftpd
    command: ["/etc/vsftpd/explicit-ftps.conf"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/21'"]
      interval: 3s
      timeout: 3s
      retries: 20

  ftps-implicit:
    profiles: ["ftp"]
    <<: *vsftpd
    command: ["/etc/vsftpd/implicit-ftps.conf"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/990'"]
      interval: 3s
      timeout: 3s
      retries: 20

  sftp:
    image: atmoz/sftp:alpine@sha256:a81ea210713555be76075b4b2788a4addfaa54d137cd881f3a99ac539f0be2c5
    command: sentinel:sentinel:1001:100:upload anonymous::1002:100
    volumes:
      - ./testenv/sftp/anonymous.sh:/etc/sftp.d/anonymous.sh:ro
      - ./frontend/e2e/keys/sentinel.pub:/home/sentinel/.ssh/keys/sentinel.pub:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 22"]
      interval: 3s
      timeout: 3s
      retries: 20

  sentinel:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: sentinel:test
    environment:
      SENTINEL_DATABASE_URL: postgres://sentinel:sentinel@postgres:5432/sentinel?sslmode=disable
      SENTINEL_BASE_URL: http://passkeys.localhost:8080
      SENTINEL_ALLOWED_ORIGINS: http://sentinel:8080
      SENTINEL_ALLOWED_NETWORKS: 172.16.0.0/12
      SENTINEL_TRANSFER_LIMIT_PER_SITE: "2"
      SENTINEL_QUICK_CONNECT_BURST: "40"
    tmpfs:
      - /data:mode=0700,uid=65532,gid=65532
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy

  e2e:
    <<: *user
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    init: true
    ipc: host
    working_dir: /workspace/frontend
    command: node_modules/.bin/playwright test
    environment:
      CI: "true"
      HOME: /tmp
      SENTINEL_E2E_URL: http://sentinel:8080
    volumes:
      - .:/workspace
    depends_on:
      sentinel:
        condition: service_healthy
      sftp:
        condition: service_healthy

volumes:
  cache:
