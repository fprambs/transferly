# Test stack. One command per suite; see the Makefile.
#   docker compose -f compose.test.yaml run --rm unit    # backend and frontend tests with coverage
#   docker compose -f compose.test.yaml run --rm e2e     # browser tests against the production image
name: transferly-test

x-user: &user
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

# vsftpd servers of the testenv profile, for the tests that need a real FTP server (profile ftp).
x-vsftpd: &vsftpd
  init: true
  build:
    context: testenv/vsftpd
  image: transferly-testenv-vsftpd

services:
  postgres:
    image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_USER: transferly
      POSTGRES_PASSWORD: transferly
      POSTGRES_DB: transferly
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transferly -d transferly"]
      interval: 2s
      timeout: 3s
      retries: 30

  unit:
    <<: *user
    profiles: ["unit"]
    build:
      context: .
      dockerfile: docker/tools.Dockerfile
    image: transferly-dev-tools
    working_dir: /workspace
    command: sh -c "./scripts/coverage-go.sh && cd frontend && pnpm install --frozen-lockfile && pnpm typecheck && pnpm lint && pnpm test:coverage"
    environment:
      CI: "true"
      TRANSFERLY_TEST_DATABASE_URL: postgres://transferly:transferly@postgres:5432/transferly_test?sslmode=disable
    volumes:
      - .:/workspace
      - cache:/cache
    depends_on:
      postgres:
        condition: service_healthy

  ftp:
    profiles: ["ftp"]
    <<: *vsftpd
    environment:
      TZ: America/Santiago
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/21'"]
      interval: 3s
      timeout: 3s
      retries: 20

  ftps:
    profiles: ["ftp"]
    <<: *vsftpd
    command: ["/etc/vsftpd/explicit-ftps.conf"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/21'"]
      interval: 3s
      timeout: 3s
      retries: 20

  ftps-implicit:
    profiles: ["ftp"]
    <<: *vsftpd
    command: ["/etc/vsftpd/implicit-ftps.conf"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/990'"]
      interval: 3s
      timeout: 3s
      retries: 20

  # An S3 server (Versity Gateway) for the S3 connector (ADR-0023): plain HTTP, the bucket transferly and its root access key.
  s3:
    profiles: ["s3"]
    image: versity/versitygw@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    entrypoint: ["sh", "-c", "mkdir -p /data/transferly && exec versitygw --access transferly --secret transferly-secret posix /data"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7070"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The fake of Google for the Google Drive connector (ADR-0024): OAuth with a consent page that agrees at once, and Drive in memory.
  # Not named google: browsers force HTTPS on that name, a top-level domain in their HSTS preload list.
  fakegoogle:
    profiles: ["google"]
    build:
      context: .
      dockerfile: testenv/google/Dockerfile
    image: transferly-testenv-google
    environment:
      FAKE_GOOGLE_URL: http://fakegoogle:8090

  # Azurite, the emulator of Azure Storage, for the Blob connector (ADR-0025), with its well-known account devstoreaccount1.
  azurite:
    profiles: ["azure"]
    image: mcr.microsoft.com/azure-storage/azurite@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--skipApiVersionCheck", "--inMemoryPersistence"]

  # The fake of Azure Files (ADR-0025), which Azurite does not emulate: account transferly, share share.
  fakeazure:
    profiles: ["azure"]
    build:
      context: .
      dockerfile: testenv/azure/Dockerfile
    image: transferly-testenv-azure

  # An OpenSSH server with a shell, zip and unzip, for the SSH tools of SFTP sites (ADR-0027): transferly / transferly.
  ssh:
    profiles: ["ssh"]
    build:
      context: testenv/ssh
    image: transferly-testenv-ssh
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/22'"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Apache httpd with mod_dav for the WebDAV connector (ADR-0026): /webdav/ with transferly / transferly, /public/ read-only.
  webdav:
    profiles: ["webdav"]
    build:
      context: testenv/webdav
    image: transferly-testenv-webdav
    tmpfs:
      - /var/dav
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/80'"]
      interval: 3s
      timeout: 3s
      retries: 20

  sftp:
    image: atmoz/sftp:alpine@sha256:a81ea210713555be76075b4b2788a4addfaa54d137cd881f3a99ac539f0be2c5
    command: transferly:transferly:1001:100:upload anonymous::1002:100
    volumes:
      - ./testenv/sftp/anonymous.sh:/etc/sftp.d/anonymous.sh:ro
      - ./frontend/e2e/keys/transferly.pub:/home/transferly/.ssh/keys/transferly.pub:ro
      - ./testenv/preview-samples:/home/transferly/preview-samples:ro
    networks:
      default:
        # A second name for the same server, whose trusted keys only the host key e2e test touches (4.13b).
        aliases: [sftp-rotating]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 22"]
      interval: 3s
      timeout: 3s
      retries: 20

  transferly:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: transferly:test
    environment:
      TRANSFERLY_DATABASE_URL: postgres://transferly:transferly@postgres:5432/transferly?sslmode=disable
      TRANSFERLY_BASE_URL: http://passkeys.localhost:8080
      TRANSFERLY_ALLOWED_ORIGINS: http://transferly:8080
      TRANSFERLY_ALLOWED_NETWORKS: 172.16.0.0/12
      TRANSFERLY_TRANSFER_LIMIT_PER_SITE: "2"
      TRANSFERLY_QUICK_CONNECT_BURST: "40"
      TRANSFERLY_GOOGLE_CLIENT_ID: transferly-test.apps.googleusercontent.com
      TRANSFERLY_GOOGLE_CLIENT_SECRET: transferly-test-secret
      TRANSFERLY_GOOGLE_AUTH_URL: http://fakegoogle:8090/o/oauth2/auth
      TRANSFERLY_GOOGLE_TOKEN_URL: http://fakegoogle:8090/token
      TRANSFERLY_GOOGLE_API_URL: http://fakegoogle:8090
    tmpfs:
      - /data:mode=0700,uid=65532,gid=65532
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy

  e2e:
    <<: *user
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    init: true
    ipc: host
    working_dir: /workspace/frontend
    command: node_modules/.bin/playwright test
    environment:
      CI: "true"
      HOME: /tmp
      TRANSFERLY_E2E_URL: http://transferly:8080
    volumes:
      - .:/workspace
    depends_on:
      transferly:
        condition: service_healthy
      sftp:
        condition: service_healthy

volumes:
  cache:
