name: transferly-restore-test
services:
  app:
    image: transferly:test
    environment:
      TRANSFERLY_DATABASE_URL: postgres://transferly:transferly@postgres:5432/transferly?sslmode=disable
      TRANSFERLY_BASE_URL: http://restore.localhost:8080
      TRANSFERLY_ALLOWED_ORIGINS: http://app:8080
      TRANSFERLY_ALLOWED_NETWORKS: 172.16.0.0/12
    volumes:
      - data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    build:
      context: ./docker
      dockerfile: postgres.Dockerfile
    image: transferly-postgres:17.12-bookworm-patched
    environment:
      POSTGRES_USER: transferly
      POSTGRES_PASSWORD: transferly
      POSTGRES_DB: transferly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transferly -d transferly"]
      interval: 2s
      timeout: 3s
      retries: 30
  sftp:
    image: atmoz/sftp:alpine@sha256:c5fb9e4beb8b7054a4c0b65c5e11df47cc20da95ad6002e88aecff62bab06372
    command: transferly:transferly:1001:100:upload
  verify:
    image: transferly-dev-tools
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    profiles: [verify]
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
      - /tmp/transferly-audit:/reports
    command: ["python3", "scripts/verify-backup.py", "check"]
volumes:
  data:
  pgdata:
