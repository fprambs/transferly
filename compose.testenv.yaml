# Test servers for every connector, to try each feature by hand and for integration tests. See testenv/README.md.
# Enable with: make testenv (docker compose -f compose.dev.yaml --profile testenv up -d --build)
# Hosts inside the Compose network: sftp:22, ftp:21, ftps:21, ftps-implicit:990, s3:7070, webdav:80, azurite:10000 (Blob),
# fakeazure:10002 (Files) and fakegoogle:8090 (Google Drive, also published on 127.0.0.1:8090 for its sign-in page), and the
# same file servers behind fault injection on toxiproxy:2222, 2121, 2122, 2990. Every server holds the preview samples.
# Credentials for the SFTP, FTP and WebDAV servers: transferly / transferly. The S3 server has the bucket transferly and the
# access key transferly with the secret transferly-secret.

x-ftp: &ftp
  profiles: ["testenv"]
  init: true
  build:
    context: testenv/vsftpd
  image: transferly-testenv-vsftpd

services:
  sftp:
    profiles: ["testenv"]
    image: atmoz/sftp:alpine@sha256:a81ea210713555be76075b4b2788a4addfaa54d137cd881f3a99ac539f0be2c5
    command: transferly:transferly:1001:100:upload
    volumes:
      - ./testenv/preview-samples:/home/transferly/preview-samples:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 22"]
      interval: 3s
      timeout: 3s
      retries: 20

  ftp:
    <<: *ftp
    environment:
      TZ: America/Santiago
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/21'"]
      interval: 3s
      timeout: 3s
      retries: 20

  ftps:
    <<: *ftp
    command: ["/etc/vsftpd/explicit-ftps.conf"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/21'"]
      interval: 3s
      timeout: 3s
      retries: 20

  ftps-implicit:
    <<: *ftp
    command: ["/etc/vsftpd/implicit-ftps.conf"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/990'"]
      interval: 3s
      timeout: 3s
      retries: 20

  s3:
    profiles: ["testenv"]
    image: versity/versitygw@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    entrypoint:
      - sh
      - -c
      - mkdir -p /data/transferly && cp -R /samples /data/transferly/preview-samples && exec versitygw --access transferly --secret transferly-secret posix /data
    tmpfs:
      - /data
    volumes:
      - ./testenv/preview-samples:/samples:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7070"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Apache httpd with mod_dav (ADR-0026): /webdav/ with transferly / transferly, and /public/, an anonymous read-only share.
  webdav:
    profiles: ["testenv"]
    build:
      context: testenv/webdav
    image: transferly-testenv-webdav
    tmpfs:
      - /var/dav
    volumes:
      - ./testenv/preview-samples:/samples:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/80'"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Azurite, the emulator of Azure Blob Storage (ADR-0025), with the well-known account devstoreaccount1; fakeazure creates its
  # container transferly with the samples.
  azurite:
    profiles: ["testenv"]
    image: mcr.microsoft.com/azure-storage/azurite@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--skipApiVersionCheck", "--inMemoryPersistence"]

  # The fake of Azure Files (ADR-0025): account transferly, share share, with the samples. It also seeds Azurite.
  fakeazure:
    profiles: ["testenv"]
    build:
      context: .
      dockerfile: testenv/azure/Dockerfile
    image: transferly-testenv-azure
    environment:
      FAKE_AZURE_SAMPLES: /samples
      FAKE_AZURE_BLOB: http://azurite:10000
    volumes:
      - ./testenv/preview-samples:/samples:ro

  # The fake of Google (ADR-0024): the sign-in page agrees at once, and My Drive lives in memory. Its port is published because
  # the browser opens the sign-in page; the backend of the development stack points at it unless a real client is configured.
  fakegoogle:
    profiles: ["testenv"]
    build:
      context: .
      dockerfile: testenv/google/Dockerfile
    image: transferly-testenv-google
    environment:
      FAKE_GOOGLE_URL: http://fakegoogle:8090
    ports:
      - "127.0.0.1:${TRANSFERLY_FAKE_GOOGLE_PORT:-8090}:8090"

  toxiproxy:
    profiles: ["testenv"]
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./testenv/toxiproxy.json:/config/toxiproxy.json:ro
    depends_on:
      sftp:
        condition: service_healthy
      ftp:
        condition: service_healthy
      ftps:
        condition: service_healthy
      ftps-implicit:
        condition: service_healthy
