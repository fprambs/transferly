# Remote servers used by integration and end-to-end tests. Nothing is published to the host.
# Enable with: docker compose -f compose.dev.yaml --profile testenv up
# Hosts inside the Compose network: sftp:22, ftp:21, ftps:21, ftps-implicit:990, s3:7070 (plain HTTP),
# and the same file servers behind fault injection on toxiproxy:2222, 2121, 2122, 2990.
# Credentials for every file server: transferly / transferly. The S3 server has the bucket transferly, with the preview
# samples under preview-samples/, and the access key transferly with the secret transferly-secret.

x-ftp: &ftp
  profiles: ["testenv"]
  init: true
  build:
    context: testenv/vsftpd
  image: transferly-testenv-vsftpd

services:
  sftp:
    profiles: ["testenv"]
    image: atmoz/sftp:alpine@sha256:a81ea210713555be76075b4b2788a4addfaa54d137cd881f3a99ac539f0be2c5
    command: transferly:transferly:1001:100:upload
    volumes:
      - ./testenv/preview-samples:/home/transferly/preview-samples:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 22"]
      interval: 3s
      timeout: 3s
      retries: 20

  ftp:
    <<: *ftp
    environment:
      TZ: America/Santiago
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/21'"]
      interval: 3s
      timeout: 3s
      retries: 20

  ftps:
    <<: *ftp
    command: ["/etc/vsftpd/explicit-ftps.conf"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/21'"]
      interval: 3s
      timeout: 3s
      retries: 20

  ftps-implicit:
    <<: *ftp
    command: ["/etc/vsftpd/implicit-ftps.conf"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/990'"]
      interval: 3s
      timeout: 3s
      retries: 20

  s3:
    profiles: ["testenv"]
    image: versity/versitygw@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    entrypoint:
      - sh
      - -c
      - mkdir -p /data/transferly && cp -R /samples /data/transferly/preview-samples && exec versitygw --access transferly --secret transferly-secret posix /data
    tmpfs:
      - /data
    volumes:
      - ./testenv/preview-samples:/samples:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7070"]
      interval: 3s
      timeout: 3s
      retries: 20

  toxiproxy:
    profiles: ["testenv"]
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./testenv/toxiproxy.json:/config/toxiproxy.json:ro
    depends_on:
      sftp:
        condition: service_healthy
      ftp:
        condition: service_healthy
      ftps:
        condition: service_healthy
      ftps-implicit:
        condition: service_healthy
