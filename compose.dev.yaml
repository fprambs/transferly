# Development stack. The host needs only Docker with Compose v2.
# Start: docker compose -f compose.dev.yaml up
# Tools: docker compose -f compose.dev.yaml run --rm tools <command>
# Test servers: add --profile testenv (see compose.testenv.yaml)
name: sentinel-dev

include:
  - compose.testenv.yaml

x-tools: &tools
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  build:
    context: .
    dockerfile: docker/tools.Dockerfile
  image: sentinel-dev-tools
  volumes:
    - .:/workspace
    - cache:/cache

services:
  tools:
    <<: *tools
    profiles: ["tools"]
    working_dir: /workspace
    environment:
      SENTINEL_TEST_DATABASE_URL: postgres://sentinel:sentinel@postgres:5432/sentinel_test?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *tools
    working_dir: /workspace/backend
    command: air -c .air.toml
    environment:
      SENTINEL_DATABASE_URL: postgres://sentinel:sentinel@postgres:5432/sentinel?sslmode=disable
      SENTINEL_HTTP_ADDR: ":8080"
      SENTINEL_LOG_LEVEL: debug
      SENTINEL_DATA_DIR: /cache/sentinel
      SENTINEL_ALLOWED_ORIGINS: http://localhost:${SENTINEL_WEB_PORT:-5173}
      SENTINEL_ALLOWED_NETWORKS: ${SENTINEL_ALLOWED_NETWORKS:-172.16.0.0/12}
    ports:
      - "127.0.0.1:${SENTINEL_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 3s
      timeout: 3s
      retries: 40

  frontend:
    <<: *tools
    working_dir: /workspace/frontend
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0 --port 5173"
    environment:
      SENTINEL_API_URL: http://backend:8080
    ports:
      - "127.0.0.1:${SENTINEL_WEB_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5173/"]
      interval: 3s
      timeout: 3s
      retries: 60

  postgres:
    image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  cache:
  pgdata:
