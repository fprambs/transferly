# Development stack. The host needs only Docker with Compose v2.
# Start: docker compose -f compose.dev.yaml up
# Tools: docker compose -f compose.dev.yaml run --rm tools <command>
# Test servers: add --profile testenv (see compose.testenv.yaml)
name: transferly-dev

include:
  - compose.testenv.yaml

x-tools: &tools
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  build:
    context: .
    dockerfile: docker/tools.Dockerfile
  image: transferly-dev-tools
  volumes:
    - .:/workspace
    - cache:/cache

services:
  tools:
    <<: *tools
    profiles: ["tools"]
    working_dir: /workspace
    environment:
      TRANSFERLY_TEST_DATABASE_URL: postgres://transferly:transferly@postgres:5432/transferly_test?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # Rust toolchain of the terminal client (tui/), apart from the Go and Node tools; see docker/rust.Dockerfile.
  rust:
    profiles: ["tools"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    build:
      context: .
      dockerfile: docker/rust.Dockerfile
    image: transferly-dev-rust
    working_dir: /workspace/tui
    environment:
      INSTA_UPDATE: "no"
    volumes:
      - .:/workspace
      - rust-cache:/cache

  backend:
    <<: *tools
    working_dir: /workspace/backend
    command: air -c .air.toml
    environment:
      TRANSFERLY_DATABASE_URL: postgres://transferly:transferly@postgres:5432/transferly?sslmode=disable
      TRANSFERLY_HTTP_ADDR: ":8080"
      TRANSFERLY_LOG_LEVEL: debug
      TRANSFERLY_DATA_DIR: /cache/transferly
      TRANSFERLY_ALLOWED_ORIGINS: http://localhost:${TRANSFERLY_WEB_PORT:-5173}
      TRANSFERLY_ALLOWED_NETWORKS: ${TRANSFERLY_ALLOWED_NETWORKS:-172.16.0.0/12}
      # Keeps the vault of each session unlocked across the restarts of air (ADR-0028); never on outside development.
      TRANSFERLY_VAULT_REMEMBER_SESSIONS: "true"
      # Google Drive signs in with the fake of the testenv profile unless a real OAuth client is given (docs/guides/google.md).
      TRANSFERLY_GOOGLE_CLIENT_ID: ${TRANSFERLY_GOOGLE_CLIENT_ID:-transferly-test.apps.googleusercontent.com}
      TRANSFERLY_GOOGLE_CLIENT_SECRET: ${TRANSFERLY_GOOGLE_CLIENT_SECRET:-transferly-test-secret}
      TRANSFERLY_GOOGLE_AUTH_URL: ${TRANSFERLY_GOOGLE_AUTH_URL:-http://localhost:8090/o/oauth2/auth}
      TRANSFERLY_GOOGLE_TOKEN_URL: ${TRANSFERLY_GOOGLE_TOKEN_URL:-http://fakegoogle:8090/token}
      TRANSFERLY_GOOGLE_API_URL: ${TRANSFERLY_GOOGLE_API_URL:-http://fakegoogle:8090}
    ports:
      - "127.0.0.1:${TRANSFERLY_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 3s
      timeout: 3s
      retries: 40

  frontend:
    <<: *tools
    working_dir: /workspace/frontend
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0 --port 5173"
    environment:
      TRANSFERLY_API_URL: http://backend:8080
    ports:
      - "127.0.0.1:${TRANSFERLY_WEB_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5173/"]
      interval: 3s
      timeout: 3s
      retries: 60

  postgres:
    image: postgres:17-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536
    environment:
      POSTGRES_USER: transferly
      POSTGRES_PASSWORD: transferly
      POSTGRES_DB: transferly
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transferly -d transferly"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  cache:
  rust-cache:
  pgdata:
