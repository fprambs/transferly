name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_DEV: docker compose -f compose.dev.yaml
  COMPOSE_TEST: docker compose -f compose.test.yaml

jobs:
  generated:
    name: Generated code is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use the runner user inside containers
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Regenerate
        run: $COMPOSE_DEV run --rm --no-deps -T tools ./scripts/generate.sh
      - name: Fail on differences
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  unit:
    name: Unit tests, lint and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use the runner user inside containers
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Backend lint and module hygiene
        run: |
          $COMPOSE_DEV run --rm -T tools sh -c 'cd backend && golangci-lint run ./... && go mod tidy -diff'
      - name: Tests with 100 percent coverage
        run: $COMPOSE_TEST run --rm unit

  e2e:
    name: Browser tests against the production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use the runner user inside containers
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Install frontend dependencies
        run: $COMPOSE_DEV run --rm --no-deps -T tools sh -c 'cd frontend && pnpm install --frozen-lockfile'
      - name: Playwright suites
        run: $COMPOSE_TEST run --rm e2e
      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  security:
    name: Vulnerability and configuration scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use the runner user inside containers
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Go and npm dependency audit
        run: |
          $COMPOSE_DEV run --rm --no-deps -T tools sh -c 'cd backend && govulncheck ./... && cd ../frontend && pnpm install --frozen-lockfile && pnpm audit --prod'
      - name: Build the production image
        run: docker compose build app
      - name: Scan the image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: sentinel:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan Dockerfiles and Compose files
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml

  image:
    name: Publish the image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [generated, unit, e2e, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/app.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
