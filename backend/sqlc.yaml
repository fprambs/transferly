version: "2"
sql:
  - engine: postgresql
    schema: migrations/postgres
    queries: queries/postgres
    gen:
      go:
        package: db
        out: internal/adapters/store/postgres/db
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: NullUUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: pg_catalog.int8
            nullable: true
            go_type:
              type: int64
              pointer: true
