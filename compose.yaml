# Production stack: docker compose up -d
# The application answers on http://localhost:8080.
# HTTPS with automatic certificates: set TRANSFERLY_DOMAIN and the matching HTTPS TRANSFERLY_BASE_URL, then add --profile https.
name: transferly

services:
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        VERSION: ${TRANSFERLY_VERSION:-dev}
    image: transferly:${TRANSFERLY_VERSION:-local}
    restart: unless-stopped
    environment:
      TRANSFERLY_DATABASE_URL: postgres://transferly:${TRANSFERLY_DB_PASSWORD:-transferly}@postgres:5432/transferly?sslmode=disable
      TRANSFERLY_HTTP_ADDR: ":8080"
      TRANSFERLY_BASE_URL: ${TRANSFERLY_BASE_URL:-http://localhost:8080}
      TRANSFERLY_DOMAIN: ${TRANSFERLY_DOMAIN:-}
      TRANSFERLY_TRUSTED_PROXIES: ${TRANSFERLY_TRUSTED_PROXIES:-172.30.252.3/32}
      TRANSFERLY_ALLOWED_NETWORKS: ${TRANSFERLY_ALLOWED_NETWORKS:-}
      TRANSFERLY_GOOGLE_CLIENT_ID: ${TRANSFERLY_GOOGLE_CLIENT_ID:-}
      TRANSFERLY_GOOGLE_CLIENT_SECRET: ${TRANSFERLY_GOOGLE_CLIENT_SECRET:-}
    ports:
      - "${TRANSFERLY_BIND:-127.0.0.1}:${TRANSFERLY_HTTP_PORT:-8080}:8080"
    volumes:
      - data:/data
    networks:
      - default
      - gateway
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # Stays on Debian 12: moving a database with data to another system can change its collations and needs a planned reindex.
    image: postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    restart: unless-stopped
    environment:
      POSTGRES_USER: transferly
      POSTGRES_PASSWORD: ${TRANSFERLY_DB_PASSWORD:-transferly}
      POSTGRES_DB: transferly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transferly -d transferly"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    profiles: ["https"]
    image: caddy:2.11.8@sha256:4fcafa98afd1c2e642e353e3c5cf9ddbe892fcee14bc990e7ba2c5b78e51f9cf
    restart: unless-stopped
    environment:
      TRANSFERLY_DOMAIN: ${TRANSFERLY_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
    networks:
      gateway:
        ipv4_address: 172.30.252.3

networks:
  gateway:
    ipam:
      config:
        - subnet: 172.30.252.0/29

volumes:
  data:
  pgdata:
  caddy_data:
