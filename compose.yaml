# Production stack: docker compose up -d
# The application answers on http://localhost:8080.
# HTTPS with automatic certificates: set SENTINEL_DOMAIN and add --profile https.
name: sentinel

services:
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: sentinel:local
    restart: unless-stopped
    environment:
      SENTINEL_DATABASE_URL: postgres://sentinel:${SENTINEL_DB_PASSWORD:-sentinel}@postgres:5432/sentinel?sslmode=disable
      SENTINEL_HTTP_ADDR: ":8080"
    ports:
      - "${SENTINEL_BIND:-127.0.0.1}:${SENTINEL_HTTP_PORT:-8080}:8080"
    volumes:
      - data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${SENTINEL_DB_PASSWORD:-sentinel}
      POSTGRES_DB: sentinel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    profiles: ["https"]
    image: caddy@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    restart: unless-stopped
    environment:
      SENTINEL_DOMAIN: ${SENTINEL_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  data:
  pgdata:
  caddy_data:
