# Production stack: docker compose up -d
# The application answers on http://localhost:8080.
# HTTPS with automatic certificates: set TRANSFERLY_DOMAIN and add --profile https.
name: transferly

services:
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: transferly:local
    restart: unless-stopped
    environment:
      TRANSFERLY_DATABASE_URL: postgres://transferly:${TRANSFERLY_DB_PASSWORD:-transferly}@postgres:5432/transferly?sslmode=disable
      TRANSFERLY_HTTP_ADDR: ":8080"
      TRANSFERLY_BASE_URL: ${TRANSFERLY_BASE_URL:-http://localhost:8080}
      TRANSFERLY_TRUSTED_PROXIES: ${TRANSFERLY_TRUSTED_PROXIES:-}
      TRANSFERLY_ALLOWED_NETWORKS: ${TRANSFERLY_ALLOWED_NETWORKS:-}
    ports:
      - "${TRANSFERLY_BIND:-127.0.0.1}:${TRANSFERLY_HTTP_PORT:-8080}:8080"
    volumes:
      - data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    restart: unless-stopped
    environment:
      POSTGRES_USER: transferly
      POSTGRES_PASSWORD: ${TRANSFERLY_DB_PASSWORD:-transferly}
      POSTGRES_DB: transferly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transferly -d transferly"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    profiles: ["https"]
    image: caddy@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    restart: unless-stopped
    environment:
      TRANSFERLY_DOMAIN: ${TRANSFERLY_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  data:
  pgdata:
  caddy_data:
