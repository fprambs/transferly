[package]
name = "transferly-client"
version = "0.0.0"
authors = ["OpenAPI Generator team and contributors"]
description = "HTTP API of the Transferly file transfer client."
license = "Apache-2.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
uuid = { version = "^1.8", features = ["serde", "v4"] }
tokio = { version = "^1.46.0", features = ["fs"] }
tokio-util = { version = "^0.7", features = ["codec"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "stream", "query", "form"] }

