[package]
name = "apistream"
version = "0.0.0"
edition = "2021"
publish = false
description = "Spike: streaming uploads with resume, ranged downloads and the events WebSocket from Rust (docs/spikes/rust-streaming.md)."

[dependencies]
anyhow = "1"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "cookies", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }
