# The terminal client of Transferly (ADR-0029). Its version is the version of the server; scripts/release.sh sets both.
[workspace]
members = ["client"]
exclude = ["mockups", "spikes"]
resolver = "3"

[package]
name = "transferly-tui"
version = "1.0.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
description = "Transferly from the terminal: browse your sites and move files between them and your disk."
repository = "https://github.com/fprambs/transferly"
publish = false

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.10", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures = "0.3.34"
gethostname = "1.1.0"
jiff = "1.0.3"
keyring-core = "1.1.0"
rand = "0.10.4"
ratatui = "0.30.2"
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
toml = "1.2.3"
transferly-client = { version = "0.0.0", path = "client" }
url = "2.5.9"
uuid = "1.29.3"
webbrowser = "1.2.7"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage,coverage_nightly)"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Sites and sides, panels and paths sit together in the explorer; the names are clear in context.
similar_names = "allow"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target."cfg(windows)".dependencies]
windows-native-keyring-store = "1"
