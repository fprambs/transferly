# Apache httpd with mod_dav, the WebDAV server of the test environments (ADR-0026).
# /webdav/ needs the user transferly with the password transferly; /public/ is an anonymous share that can only be read.
ServerRoot "/usr/local/apache2"
Listen 80
ServerName webdav

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule alias_module modules/mod_alias.so
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so

User daemon
Group daemon

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %u \"%r\" %>s %b" common
CustomLog /proc/self/fd/1 common
TypesConfig conf/mime.types

DavLockDB /var/dav/lock/DavLock
LimitRequestBody 0

<Directory />
    AllowOverride None
    Require all denied
</Directory>

Alias /webdav /var/dav/files
<Directory /var/dav/files>
    Dav On
    Options None
    AuthType Basic
    AuthName "Transferly WebDAV"
    AuthUserFile /usr/local/apache2/conf/dav.passwd
    Require valid-user
</Directory>

Alias /public /var/dav/public
<Directory /var/dav/public>
    Dav On
    Options None
    <LimitExcept GET HEAD OPTIONS PROPFIND>
        Require all denied
    </LimitExcept>
    Require all granted
</Directory>
