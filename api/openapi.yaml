openapi: 3.1.0
info:
  title: Sentinel API
  version: 0.1.0
  description: HTTP API of the Sentinel file transfer client.
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      summary: Liveness probe
      description: Answers while the process is alive; it never checks dependencies.
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: getReadiness
      security: []
      summary: Readiness probe
      description: Checks that the backend and its dependencies can serve traffic.
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: A dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /api/v1/setup/status:
    get:
      operationId: getSetupStatus
      summary: Whether the first administrator still has to be created
      security: []
      responses:
        "200":
          description: The setup state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /api/v1/setup:
    post:
      operationId: setup
      summary: Create the first administrator and sign in
      description: Only works while no account exists. Rate limited per client address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "201":
          description: Administrator created and signed in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "409":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Sign in
      description: Rate limited per client address and per account. Wrong emails and wrong passwords are indistinguishable.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/logout:
    post:
      operationId: logout
      security:
        - sessionCookie: []
      summary: Sign out
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Signed out; the session cookie is cleared.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/me:
    get:
      operationId: getMe
      security:
        - sessionCookie: []
      summary: The signed-in user and the anti-CSRF token of the session
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      operationId: updateMe
      security:
        - sessionCookie: []
      summary: Change the interface language and time zone
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Preferences"
      responses:
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      security:
        - sessionCookie: []
      summary: Workspaces the signed-in user belongs to, with their role in each
      responses:
        "200":
          description: The workspaces, personal first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/workspaces/{workspaceId}:
    get:
      operationId: getWorkspace
      security:
        - sessionCookie: []
      summary: One workspace of the signed-in user
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: The workspace and the role of the user in it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/vault:
    get:
      operationId: getVault
      summary: State of the vault in this session
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Whether the vault exists and is unlocked in this session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultStatus"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/vault/setup:
    post:
      operationId: setupVault
      summary: Create the vault and unlock it
      description: The recovery kit in the response is shown once and never stored; without it a lost master password loses every secret.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MasterPasswordRequest"
      responses:
        "201":
          description: Vault created and unlocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryKit"
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/vault/unlock:
    post:
      operationId: unlockVault
      summary: Unlock the vault for this session
      description: Rate limited per account.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MasterPasswordRequest"
      responses:
        "204":
          description: Vault unlocked.
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/vault/lock:
    post:
      operationId: lockVault
      summary: Lock the vault for this session
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Vault locked.
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/vault/password:
    post:
      operationId: changeMasterPassword
      summary: Change the master password
      description: Needs the current one. Rate limited per account.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeMasterPasswordRequest"
      responses:
        "204":
          description: Master password changed; the session stays unlocked.
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/vault/recover:
    post:
      operationId: recoverVault
      summary: Set a new master password with the recovery kit
      description: Unlocks the vault for this session. Rate limited per account.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoverVaultRequest"
      responses:
        "204":
          description: Master password replaced; the session is unlocked.
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/vault/recovery-kit:
    post:
      operationId: regenerateRecoveryKit
      summary: Replace the recovery kit
      description: Needs the master password; the previous kit stops working. Rate limited per account.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MasterPasswordRequest"
      responses:
        "200":
          description: The new recovery kit, shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryKit"
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/workspaces/{workspaceId}/sites:
    get:
      operationId: listSites
      security:
        - sessionCookie: []
      summary: Sites of a workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: The sites by name, with the kinds of secret stored but never the secrets.
          content:
            application/json:
              schema:
                type: array
                items:
                    $ref: "#/components/schemas/Site"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: createSite
      security:
        - sessionCookie: []
      summary: Save a site
      description: Writing secrets needs the vault unlocked in the session. Hosts on private networks are refused unless the administrator allowed them.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteInput"
      responses:
        "201":
          description: The saved site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/workspaces/{workspaceId}/sites/{siteId}:
    get:
      operationId: getSite
      security:
        - sessionCookie: []
      summary: One site
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: The site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      operationId: updateSite
      security:
        - sessionCookie: []
      summary: Change a site
      description: Secrets left out stay as they are, an empty string removes one and any other value replaces it.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteInput"
      responses:
        "200":
          description: The updated site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deleteSite
      security:
        - sessionCookie: []
      summary: Delete a site and its secrets
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Deleted.
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/workspaces/{workspaceId}/known-hosts:
    get:
      operationId: listKnownHosts
      security:
        - sessionCookie: []
      summary: Server keys trusted in a workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: The trusted keys by host, port and type.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnownHost"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: trustHostKey
      security:
        - sessionCookie: []
      summary: Trust a server key
      description: Records the key a user saw and confirmed. A different key of the same type must be forgotten first.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostKeyInput"
      responses:
        "201":
          description: The trusted key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnownHost"
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: forgetHostKey
      security:
        - sessionCookie: []
      summary: Forget a trusted key, so the next connection asks again
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/CsrfToken"
        - name: host
          in: query
          required: true
          description: Server name or address.
          schema:
            type: string
        - name: port
          in: query
          required: true
          description: Server port.
          schema:
            type: integer
        - name: keyType
          in: query
          required: true
          description: Key algorithm, such as ssh-ed25519.
          schema:
            type: string
      responses:
        "204":
          description: Forgotten.
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/workspaces/{workspaceId}/sites/{siteId}/files:
