components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: transferly_session
      description: Opaque session token set by login and setup. State-changing requests also need the X-CSRF-Token header.
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Anti-CSRF token returned with the session and bound to it. Mandatory on state-changing requests of signed-in users; the server answers 403 csrf_invalid without it.
      schema:
        type: string
    FileZillaMasterPassword:
      name: X-FileZilla-Master-Password
      in: header
      required: false
      description: Master password of FileZilla when the file stores site passwords with encoding crypt. Sent only for the request; never returned or stored.
      schema:
        type: string
        maxLength: 1024
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Identifier of the workspace.
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      description: Identifier of the invitation.
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      description: Identifier of the user.
      schema:
        type: string
        format: uuid
    SiteId:
      name: siteId
      in: path
      required: true
      description: Identifier of the site.
      schema:
        type: string
        format: uuid
    RemotePath:
      name: path
      in: query
      required: true
      description: Path on the remote server.
      schema:
        type: string
    TransferId:
      name: transferId
      in: path
      required: true
      description: Identifier of the transfer.
      schema:
        type: string
        format: uuid
    TransferIdQuery:
      name: transferId
      in: query
      required: false
      description: Identifier the client chose for this transfer, to follow it and to resume it; a new one is generated when left out.
      schema:
        type: string
        format: uuid
    CollectionId:
      name: collectionId
      in: path
      required: true
      description: Identifier of the collection.
      schema:
        type: string
        format: uuid
    PromptId:
      name: promptId
      in: path
      required: true
      description: Identifier of a prompt, from its connection.prompt event.
      schema:
        type: string
        format: uuid
    BookmarkId:
      name: bookmarkId
      in: path
      required: true
      description: Identifier of the bookmark.
      schema:
        type: string
        format: uuid
    QuickId:
      name: quickId
      in: path
      required: true
      description: Identifier of the quick connection.
      schema:
        type: string
        format: uuid
  headers:
    SetCookie:
      description: Sets or clears the session cookie (HttpOnly, SameSite=Lax, Secure over https).
      schema:
        type: string
  responses:
    RateLimited:
      description: Too many attempts; retry after the indicated time.
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ExportRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          description: The password that seals the file; at least 12 characters.
    TransferlyImport:
      type: object
      additionalProperties: false
      required: [password, file]
      properties:
        password:
          type: string
          description: The password the file was sealed with.
        file:
          type: string
          description: The text of the file, as exportSites answered it.
    PromptAnswers:
      type: object
      additionalProperties: false
      required: [answers]
      properties:
        answers:
          type: array
          maxItems: 16
          items:
            type: string
            maxLength: 1024
    HealthStatus:
      type: object
      description: Status reported by a health endpoint.
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Problem:
      type: object
      description: RFC 9457 problem document returned on errors.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: URI reference identifying the problem type; about:blank when generic.
        title:
          type: string
          description: Fixed English summary meant for logs, never for display.
        status:
          type: integer
          description: HTTP status code.
        code:
          type: string
          description: Stable machine-readable code that clients translate.
        params:
          type: object
          additionalProperties: true
          description: Values used to fill the translated message.
    SetupStatus:
      type: object
      required: [required]
      properties:
        required:
          type: boolean
          description: True until the first administrator exists.
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          description: Sent to the server only; never returned.
    VaultStatus:
      type: object
      required: [initialized, unlocked]
      properties:
        initialized:
          type: boolean
        unlocked:
          type: boolean
    MasterPasswordRequest:
      type: object
      required: [masterPassword]
      properties:
        masterPassword:
          type: string
          description: Sent to the server only; never returned.
    OpenConnections:
      type: object
      required: [siteIds]
      properties:
        siteIds:
          type: array
          items:
            type: string
            format: uuid
    SshKeyInspectRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 65536
          description: The text of the key file. Never returned, stored or logged.
        passphrase:
          type: string
          maxLength: 1024
          description: The passphrase to check against an encrypted key. Never returned, stored or logged.
    SshKeyInfo:
      type: object
      required: [private, format, encrypted, status]
      properties:
        private:
          type: boolean
          description: False when the file holds a public key.
        format:
          type: string
          enum: [openssh, pem, pkcs8, rfc4716, ppk2, ppk3]
        algorithm:
          type: string
          description: SSH name of the key type, such as ssh-ed25519; absent when the file does not tell before decrypting.
        bits:
          type: integer
          description: Size of the key; absent when unknown.
        fingerprint:
          type: string
          description: SHA-256 fingerprint in OpenSSH's form; absent when the file does not tell before decrypting.
        encrypted:
          type: boolean
          description: The private key is protected by a passphrase.
        status:
          type: string
          enum: [usable, public_key, passphrase_required, wrong_passphrase]
          description: >-
            usable means the site can be saved with this key and passphrase; public_key that a private key must be chosen
            instead; the other two that the passphrase is missing or does not open the key.
    SiteCredentialRequest:
      type: object
      required: [password, remember]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 4096
          description: Sent to the server only; never returned or stored.
        remember:
          type: boolean
          description: Keep it for the rest of the session; otherwise it goes once no connection to the site is open.
    ChangeMasterPasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    RecoverVaultRequest:
      type: object
      required: [recoveryKit, newPassword]
      properties:
        recoveryKit:
          type: string
        newPassword:
          type: string
    RecoveryKit:
      type: object
      required: [recoveryKit]
      properties:
        recoveryKit:
          type: string
          description: Key that recovers the vault when the master password is lost. Shown once.
    SiteColor:
      type: string
      enum: [red, orange, yellow, green, teal, blue, violet, pink]
      description: Label the site wears in the interface, so servers tell apart at a glance (ADR-0021); each theme draws it in its own tones.
    Site:
      type: object
      required: [id, name, connector, config, speedLimitBps, secrets, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        collectionId:
          type: string
          format: uuid
          description: Left out for sites at the top level.
        name:
          type: string
        connector:
          type: string
          description: Type of the connector the site uses, such as sftp or ftp (ADR-0022).
        config:
          $ref: "#/components/schemas/SiteConfig"
        speedLimitBps:
          type: integer
          format: int64
          description: Bytes per second the site's transfers move together, on top of the global and per-user caps of the instance; 0 means the site has no cap of its own.
        remoteDir:
          type: string
          description: Folder the site opens in, as FileZilla's default remote directory (4.14i). Left out when it opens at the root.
        color:
          allOf: [$ref: "#/components/schemas/SiteColor"]
          description: Left out when the site wears no label.
        secrets:
          type: array
          description: Kinds of secret stored for the site, the names of the secret fields of its connector. The secrets themselves are never returned.
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SiteConfig:
      type: object
      description: >-
        Configuration of the site's connector, by setting name, as the connector's schema settles it (ADR-0022): values trimmed, defaults
        filled in, and the settings that do not apply left out. Secrets are never part of it.
      additionalProperties:
        type: string
    SiteSecretChanges:
      type: object
      description: >-
        Write only. Secrets to store, by the name of their field in the connector's schema. A secret left out keeps the stored one, an empty
        string removes it, and secrets whose field does not apply to the configuration are removed whatever is sent.
      additionalProperties:
        type: string
    SiteInput:
      type: object
      required: [name, connector, config]
      properties:
        collectionId:
          type: string
          format: uuid
          description: Collection to keep the site in; left out keeps it at the top level.
        name:
          type: string
        connector:
          type: string
          description: Type of the connector; one the instance does not offer is connector_disabled.
        config:
          allOf: [$ref: "#/components/schemas/SiteConfig"]
          description: Settings of the connector; one that breaks its schema is invalid_config with the field and the reason.
        speedLimitBps:
          type: integer
          format: int64
          minimum: 0
          description: Bytes per second the site's transfers move together; left out or 0 means no cap of its own.
        remoteDir:
          type: string
          description: Absolute folder the site opens in; left out, empty or / opens the root. Stored cleaned; invalid_remote_dir otherwise.
        color:
          type: string
          description: Label of the site, one of SiteColor; left out or empty for none, invalid_color otherwise.
        secrets:
          $ref: "#/components/schemas/SiteSecretChanges"
    KnownHost:
      type: object
      required: [host, port, keyType, fingerprint, firstSeen]
      properties:
        host:
          type: string
        port:
          type: integer
        keyType:
          type: string
        fingerprint:
          type: string
          description: SHA-256 fingerprint in OpenSSH notation.
        firstSeen:
          type: string
          format: date-time
    HostKeyInput:
      type: object
      required: [host, port, keyType, fingerprint]
      properties:
        host:
          type: string
        port:
          type: integer
        keyType:
          type: string
        fingerprint:
          type: string
        mode:
          type: string
          enum: [add, replace]
          description: >-
            What to do when a different key of the same type is already trusted (4.13b): add this one next to it, for a service with
            several servers behind one name, or replace it, for a server whose key changed. Left out, such a key is refused with
            host_key_changed.
    RemoteEntry:
      type: object
      required: [name, path, type, size, mode, modifiedAt, modifiedPrecision]
      properties:
        name:
          type: string
        path:
          type: string
        type:
          type: string
          enum: [file, directory, symlink, other]
        size:
          type: integer
          format: int64
        mode:
          type: string
          description: Permissions in the notation of ls, such as -rw-r--r--.
        modifiedAt:
          type: string
          format: date-time
          description: Modification time in UTC.
        modifiedPrecision:
          type: string
          enum: [second, minute, day]
          description: How exact modifiedAt is, since some servers only list the minute or the day.
    PathInput:
      type: object
      required: [path]
      properties:
        path:
          type: string
    RenameInput:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
        to:
          type: string
    TimeZoneProbe:
      type: object
      required: [exact, offsetMinutes]
      properties:
        exact:
          type: boolean
          description: The listing gives exact times in UTC, so no zone is needed.
        offsetMinutes:
          type: integer
          description: How far the times the server prints are from UTC, in minutes, rounded to a quarter of an hour.
        suggestedZone:
          type: string
          description: An IANA zone with that offset, when the offset is a whole number of hours.
    ImportItem:
      type: object
      required: [name, path, status, passwordStored, passwordSkipped]
      properties:
        name:
          type: string
        path:
          type: string
          description: The folders that hold the site, joined with slashes.
        status:
          type: string
          enum: [created, would_create, skipped, failed]
        reason:
          type: string
          description: Stable code that says why a site was skipped or failed.
        passwordStored:
          type: boolean
        passwordSkipped:
          type: boolean
          description: The file had a password that was not stored.
    ImportResult:
      type: object
      required: [dryRun, items]
      properties:
        dryRun:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/ImportItem"
    ActivityEntry:
      type: object
      required: [id, siteName, kind, path, at]
      properties:
        id:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
          description: Left out for a quick connection and once the site was deleted.
        siteName:
          type: string
          description: Name of the connection when it happened.
        kind:
          type: string
          enum: [mkdir, rename, delete, checksum, transfer]
        path:
          type: string
        detail:
          type: string
          description: The new path of a rename, the algorithm of a checksum, or the direction and final state of a transfer.
        errorCode:
          type: string
          description: Stable code of the failure; left out when the action worked.
        at:
          type: string
          format: date-time
    ArchiveEntry:
      type: object
      required: [name, type, size, packed]
      properties:
        name:
          type: string
          description: Path of the entry inside the archive, with slashes, as the archive stores it.
        type:
          type: string
          enum: [file, directory, symlink]
        size:
          type: integer
          format: int64
          description: Size once extracted, or -1 when the archive does not tell it.
        packed:
          type: integer
          format: int64
          description: Size inside the archive, or -1 when the archive does not tell it.
        modified:
          type: string
          format: date-time
          description: When it last changed, when the archive tells it.
    ArchiveListing:
      type: object
      required: [format, entries, truncated]
      properties:
        format:
          type: string
          enum: [zip, 7z, rar, tar, tar.gz, tar.bz2, tar.xz, tar.zst, gz, bz2, xz, zst]
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ArchiveEntry"
        truncated:
          type: boolean
          description: The archive holds more entries than the listing.
    Connector:
      type: object
      required: [type, name, icon, maturity, capabilities, fields, enabledByDefault, enabled]
      properties:
        type:
          type: string
          description: Stable identifier, such as sftp or s3.
        name:
          type: string
        icon:
          type: string
        maturity:
          type: string
          enum: [stable, beta]
        capabilities:
          $ref: "#/components/schemas/ConnectorCapabilities"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorField"
        enabledByDefault:
          type: boolean
        enabled:
          type: boolean
          description: Whether the instance offers it, as an administrator set it or, without a setting, as enabledByDefault says.
    ConnectorEnablement:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
    ConnectorCapabilities:
      type: object
      required: [folders, permissions, setTimes, resume, rename, serverCopy]
      properties:
        folders:
          type: boolean
        permissions:
          type: boolean
        setTimes:
          type: boolean
        resume:
          type: boolean
        rename:
          type: boolean
        serverCopy:
          type: boolean
    ConnectorField:
      type: object
      required: [name, kind, group, required]
      properties:
        name:
          type: string
          description: Name of the setting, in snake case; for secrets, also the kind of the secret.
        kind:
          type: string
          enum: [text, number, boolean, choice, host, timezone, secret, private_key, oauth]
          description: >-
            host is a server name or address the network policy must allow, with the field port names; secret, private_key and oauth are
            sealed in the vault, given in secrets and never returned; private_key is read with the field passphrase names; oauth is filled
            by signing in with the provider it names, and the field account keeps which account signed in.
        group:
          type: string
          enum: [connection, access, advanced, charset, proxy, jump]
          description: Tab of the site form the field is shown on.
        required:
          type: boolean
        default:
          type: string
        defaults:
          type: array
          description: Defaults that depend on other fields; the first whose condition holds wins over default.
          items:
            $ref: "#/components/schemas/ConnectorDefault"
        fixed:
          type: array
          description: Values the field takes while their condition holds, whatever is sent, such as the anonymous user; the form shows them read only.
          items:
            $ref: "#/components/schemas/ConnectorDefault"
        when:
          $ref: "#/components/schemas/ConnectorCondition"
        choices:
          type: array
          items:
            type: string
        min:
          type: integer
        max:
          type: integer
        maxLength:
          type: integer
        port:
          type: string
          description: The port field of a host.
        passphrase:
          type: string
          description: The passphrase field of a private key.
        provider:
          type: string
          description: Who an oauth field signs in with, such as google.
        account:
          type: string
          description: The text field of an oauth field that keeps the account that signed in.
    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
    GoogleAuthorization:
      type: object
      required: [url, state]
      properties:
        url:
          type: string
          description: The consent page of Google, to open in a popup.
        state:
          type: string
          description: Ties the outcome published by the callback page to this sign-in.
    ConnectorCondition:
      type: object
      required: [field]
      description: When a field applies, from the value of a field declared before it; a field that does not apply is left out and its secret removed.
      properties:
        field:
          type: string
        in:
          type: array
          description: Values for which the condition holds; left out, it holds whenever the other field has a value.
          items:
            type: string
    ConnectorDefault:
      type: object
      required: [when, value]
      properties:
        when:
          $ref: "#/components/schemas/ConnectorCondition"
        value:
          type: string
    Checksum:
      type: object
      required: [algorithm, checksum, size]
      properties:
        algorithm:
          type: string
          enum: [md5, sha1, sha256, sha512]
        checksum:
          type: string
          description: The digest in lower case hexadecimal.
        size:
          type: integer
          format: int64
          description: Number of bytes that were read.
    CopyInput:
      type: object
      required: [sourceSiteId, sourcePath, targetSiteId, targetPath]
      properties:
        sourceSiteId:
          type: string
          format: uuid
          description: Saved site or quick connection to read from.
        sourcePath:
          type: string
        targetSiteId:
          type: string
          format: uuid
          description: Saved site or quick connection to write to.
        targetPath:
          type: string
          description: Full path of the copy, including its name.
        policy:
          type: string
          enum: [fail, overwrite, skip, newer, rename]
          description: >-
            What to do with a file that already exists at the destination: fail the copy (the default), overwrite it,
            skip it, overwrite it only when the source is newer, or keep both by giving the copy a free name such as
            "report (1).txt". Folders that exist are merged into.
        verify:
          type: boolean
          description: >-
            Read every copied file back and compare its SHA-256 with the bytes that were sent; a difference fails the transfer with
            checksum_mismatch. Defaults to false.
        transferId:
          type: string
          format: uuid
          description: Identifier for the transfer, chosen by the client. The server picks one when left out.
    Transfer:
      type: object
      required: [id, workspaceId, siteName, direction, path, name, status, bytesDone, attempts, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
          description: Left out once the site was deleted.
        siteName:
          type: string
        direction:
          type: string
          enum: [upload, download, copy]
        path:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [queued, running, done, failed, canceled, interrupted]
        totalBytes:
          type: integer
          format: int64
          description: Left out while the size is unknown.
        bytesDone:
          type: integer
          format: int64
          description: For an upload, where a resume continues.
        errorCode:
          type: string
          description: Stable code of the error that stopped the transfer.
        attempts:
          type: integer
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        paused:
          type: boolean
          description: True while a waiting transfer is held back by its user.
        priority:
          type: integer
          enum: [-1, 0, 1]
          description: Place in the queue of a waiting transfer, from low (-1) to high (1).
    TransferPriorityInput:
      type: object
      required: [priority]
      properties:
        priority:
          type: integer
          enum: [-1, 0, 1]
    Collection:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parentId:
          type: string
          format: uuid
          description: Left out for collections at the top level.
    Bookmark:
      type: object
      required: [id, name, path, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Display name, unique on the site regardless of case, up to 100 characters.
        path:
          type: string
          description: Absolute remote path of the folder.
        createdAt:
          type: string
          format: date-time
    BookmarkInput:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string
    BookmarkChanges:
      type: object
      properties:
        name:
          type: string
        path:
          type: string
    SiteMove:
      type: object
      properties:
        collectionId:
          type: string
          format: uuid
          description: Collection to put the site in; left out for the top level.
    CollectionInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        parentId:
          type: string
          format: uuid
          description: Left out to create at the top level.
    CollectionChanges:
      type: object
      properties:
        name:
          type: string
        parentId:
          type: string
          format: uuid
          description: Move under this collection.
        moveToTop:
          type: boolean
          description: Move to the top level; wins over parentId.
    QuickConnectInput:
      type: object
      required: [connector, config]
      properties:
        connector:
          type: string
        config:
          $ref: "#/components/schemas/SiteConfig"
        secrets:
          allOf: [$ref: "#/components/schemas/SiteSecretChanges"]
          description: Write only; kept in memory until the connection ends.
    QuickConnection:
      type: object
      required: [id, name, connector, config, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: The host.
        connector:
          type: string
        config:
          $ref: "#/components/schemas/SiteConfig"
        createdAt:
          type: string
          format: date-time
    QuickSaveInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        collectionId:
          type: string
          format: uuid
          description: Collection to keep the site in; left out keeps it at the top level.
    Workspace:
      type: object
      required: [id, name, kind, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum: [personal, team]
        role:
          type: string
          enum: [owner, admin, editor, viewer]
          description: Role of the signed-in user in the workspace.
        createdAt:
          type: string
          format: date-time
    CreateWorkspaceInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Display name, 1 to 80 characters.
    Member:
      type: object
      required: [userId, email, role, joinedAt, keyState]
      properties:
        keyState:
          type: string
          enum: [sealed, waiting]
          description: >-
            sealed when the member holds a copy of the workspace key. waiting when they have none yet, because they have not set up
            their vault; a member with an unlocked vault hands it over the next time they open the workspace.
        userId:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [owner, admin, editor, viewer]
        joinedAt:
          type: string
          format: date-time
    MemberRoleInput:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, editor, viewer]
    TransferInput:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
          description: Member who becomes the owner.
    InvitationInput:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
        role:
          type: string
          enum: [admin, editor, viewer]
    Invitation:
      type: object
      required: [id, email, role, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [admin, editor, viewer]
        invitedBy:
          type: string
          description: Email of the member who invited; left out when that account no longer exists.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    InvitationCreated:
      type: object
      required: [invitation, token]
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        token:
          type: string
          description: Secret of the invitation, shown only here. The link is the app address with /invite#token.
    InvitationToken:
      type: object
      required: [token]
      properties:
        token:
          type: string
    InvitationJoinInput:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
    InvitationPreview:
      type: object
      required: [workspaceName, email, role, expiresAt, accountExists]
      properties:
        workspaceName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, editor, viewer]
        invitedBy:
          type: string
        expiresAt:
          type: string
          format: date-time
        accountExists:
          type: boolean
          description: Whether the invited address already has an account, so the client offers sign-in or sign-up.
    AdminUser:
      type: object
      required: [id, email, role, disabled, secondFactor, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [admin, user]
        disabled:
          type: boolean
        secondFactor:
          type: boolean
          description: Whether the account has an authenticator app or a passkey.
        createdAt:
          type: string
          format: date-time
    AdminUserPatch:
      type: object
      properties:
        disabled:
          type: boolean
        role:
          type: string
          enum: [admin, user]
    InstanceLimits:
      type: object
      description: Zero means no limit.
      required: [bandwidthGlobal, bandwidthPerUser, transfersGlobal, transfersPerWorkspace, transfersPerUser, transfersPerSite, maxSitesPerWorkspace, maxTeamsPerUser, maxMembersPerTeam, dailyBytesPerUser]
      properties:
        bandwidthGlobal:
          type: integer
          format: int64
          minimum: 0
          description: Bytes per second all transfers of the server move together.
        bandwidthPerUser:
          type: integer
          format: int64
          minimum: 0
          description: Bytes per second the transfers of one person move together.
        transfersGlobal:
          type: integer
          format: int64
          minimum: 0
          description: Transfers that run at once on the server.
        transfersPerWorkspace:
          type: integer
          format: int64
          minimum: 0
          description: Transfers that run at once in one workspace.
        transfersPerUser:
          type: integer
          format: int64
          minimum: 0
          description: Transfers that run at once for one person.
        transfersPerSite:
          type: integer
          format: int64
          minimum: 0
          description: Transfers that run at once against one site.
        maxSitesPerWorkspace:
          type: integer
          format: int64
          minimum: 0
          description: Sites a workspace keeps.
        maxTeamsPerUser:
          type: integer
          format: int64
          minimum: 0
          description: Teams a person owns.
        maxMembersPerTeam:
          type: integer
          format: int64
          minimum: 0
          description: Members of a team, counting the invitations that wait.
        dailyBytesPerUser:
          type: integer
          format: int64
          minimum: 0
          description: Bytes a person moves in a day.
    InstanceLimitsView:
      type: object
      required: [current, defaults]
      properties:
        current:
          $ref: "#/components/schemas/InstanceLimits"
        defaults:
          $ref: "#/components/schemas/InstanceLimits"
    Networks:
      type: object
      required: [fixed, custom]
      properties:
        fixed:
          type: array
          description: Networks the server was started with; only a restart changes them.
          items:
            type: string
        custom:
          type: array
          description: Networks an administrator allowed.
          items:
            type: string
    NetworksInput:
      type: object
      required: [networks]
      properties:
        networks:
          type: array
          maxItems: 100
          items:
            type: string
    AuditEvent:
      type: object
      required: [id, action, target, meta, at]
      properties:
        id:
          type: integer
          format: int64
          description: Orders the events; larger is newer. Pass the last one as `before` for the next page.
        actor:
          type: string
          description: Email of who did it; left out once that account no longer exists.
        action:
          type: string
        target:
          type: string
        ip:
          type: string
        meta:
          type: object
          additionalProperties:
            type: string
        at:
          type: string
          format: date-time
    MfaChallenge:
      type: object
      required: [challenge, methods]
      properties:
        challenge:
          type: string
          description: Proof of the password step, valid for five minutes.
        methods:
          type: array
          items:
            type: string
            enum: [totp, passkey, recovery]
    MfaInput:
      type: object
      required: [challenge, code]
      properties:
        challenge:
          type: string
        code:
          type: string
          description: A six digit code of the authenticator app, or a recovery code.
    CodeInput:
      type: object
      required: [code]
      properties:
        code:
          type: string
    PasswordInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
    SecurityStatus:
      type: object
      required: [totp, recoveryCodesLeft, passkeys]
      properties:
        totp:
          type: boolean
        passkeys:
          type: array
          items:
            $ref: "#/components/schemas/Passkey"
        recoveryCodesLeft:
          type: integer
    Passkey:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    PasskeyCeremony:
      type: object
      required: [ceremony, options]
      properties:
        ceremony:
          type: string
          description: Token that ties the answer of the browser to this challenge. It works once and expires in five minutes.
        options:
          type: object
          additionalProperties: true
          description: The options for navigator.credentials.create() or get(), as WebAuthn defines them.
    PasskeyRegistrationInput:
      type: object
      required: [ceremony, name, credential]
      properties:
        ceremony:
          type: string
        name:
          type: string
        credential:
          type: object
          additionalProperties: true
          description: The credential the browser made, as JSON.
    PasskeyAdded:
      type: object
      required: [passkey]
      properties:
        passkey:
          $ref: "#/components/schemas/Passkey"
        recoveryCodes:
          type: array
          items:
            type: string
          description: Created when the account had none, shown only here.
    MfaChallengeInput:
      type: object
      required: [challenge]
      properties:
        challenge:
          type: string
    PasskeyLoginInput:
      type: object
      required: [challenge, ceremony, credential]
      properties:
        challenge:
          type: string
        ceremony:
          type: string
        credential:
          type: object
          additionalProperties: true
    TotpSetup:
      type: object
      required: [secret, uri]
      properties:
        secret:
          type: string
          description: The secret in base32, to type into an app that cannot scan.
        uri:
          type: string
          description: The otpauth address to show as a QR code.
    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          items:
            type: string
    Preferences:
      type: object
      properties:
        locale:
          type: string
          description: BCP 47 language tag of the interface.
        timezone:
          type: string
          description: IANA time zone name.
        theme:
          type: string
          description: Identifier of the interface theme, such as transferly-dark or monokai. Lower case letters, digits and hyphens, up to 40. The clients know the themes.
        fileDoubleClick:
          type: string
          enum: [download, edit, preview]
          description: What a double click, or Enter, on a file of the explorer does. Download, as FileZilla does, is the default; preview shows it in the viewer (ADR-0018).
    User:
      type: object
      required: [id, email, role, locale, timezone, theme, fileDoubleClick]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [admin, user]
        locale:
          type: string
        timezone:
          type: string
        theme:
          type: string
        fileDoubleClick:
          type: string
          enum: [download, edit, preview]
    SessionInfo:
      type: object
      required: [user, csrfToken]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string
          description: Send it as X-CSRF-Token on state-changing requests.
