      summary: Find the time zone in which an FTP server prints file times
      description: >-
        FTP listings carry no time zone. The server writes a small file of its own in the folder, reads the time the listing prints for it,
        compares it with its clock and removes the file. Servers that list exact times need no zone.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/RemotePath"
      responses:
        "200":
          description: What the probe learned.
          content:
