components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sentinel_session
      description: Opaque session token set by login and setup. State-changing requests also need the X-CSRF-Token header.
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Anti-CSRF token returned with the session and bound to it. Mandatory on state-changing requests of signed-in users; the server answers 403 csrf_invalid without it.
      schema:
        type: string
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Identifier of the workspace.
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      description: Identifier of the invitation.
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      description: Identifier of the user.
      schema:
        type: string
        format: uuid
    SiteId:
      name: siteId
      in: path
      required: true
      description: Identifier of the site.
      schema:
        type: string
        format: uuid
    RemotePath:
      name: path
      in: query
      required: true
      description: Path on the remote server.
      schema:
        type: string
    TransferId:
      name: transferId
      in: path
      required: true
      description: Identifier of the transfer.
      schema:
        type: string
        format: uuid
    TransferIdQuery:
      name: transferId
      in: query
      required: false
      description: Identifier the client chose for this transfer, to follow it and to resume it; a new one is generated when left out.
      schema:
        type: string
        format: uuid
    CollectionId:
      name: collectionId
      in: path
      required: true
      description: Identifier of the collection.
      schema:
        type: string
        format: uuid
    QuickId:
      name: quickId
      in: path
      required: true
      description: Identifier of the quick connection.
      schema:
        type: string
        format: uuid
  headers:
    SetCookie:
      description: Sets or clears the session cookie (HttpOnly, SameSite=Lax, Secure over https).
      schema:
        type: string
  responses:
    RateLimited:
      description: Too many attempts; retry after the indicated time.
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    HealthStatus:
      type: object
      description: Status reported by a health endpoint.
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Problem:
      type: object
      description: RFC 9457 problem document returned on errors.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: URI reference identifying the problem type; about:blank when generic.
        title:
          type: string
          description: Fixed English summary meant for logs, never for display.
        status:
          type: integer
          description: HTTP status code.
        code:
          type: string
          description: Stable machine-readable code that clients translate.
        params:
          type: object
          additionalProperties: true
          description: Values used to fill the translated message.
    SetupStatus:
      type: object
      required: [required]
      properties:
        required:
          type: boolean
          description: True until the first administrator exists.
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          description: Sent to the server only; never returned.
    VaultStatus:
      type: object
      required: [initialized, unlocked]
      properties:
        initialized:
          type: boolean
        unlocked:
          type: boolean
    MasterPasswordRequest:
      type: object
      required: [masterPassword]
      properties:
        masterPassword:
          type: string
          description: Sent to the server only; never returned.
    ChangeMasterPasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    RecoverVaultRequest:
      type: object
      required: [recoveryKit, newPassword]
      properties:
        recoveryKit:
          type: string
        newPassword:
          type: string
    RecoveryKit:
      type: object
      required: [recoveryKit]
      properties:
        recoveryKit:
          type: string
          description: Key that recovers the vault when the master password is lost. Shown once.
    Charset:
      type: string
      enum: [utf-8, iso-8859-1, iso-8859-2, iso-8859-15, windows-1250, windows-1251, windows-1252, koi8-r, shift_jis, euc-jp, gbk, big5, euc-kr]
      description: Character set of the file names of the server. Only FTP and FTPS accept another one than UTF-8.
    Site:
      type: object
      required: [id, name, protocol, host, port, username, authMethod, listTimezone, charset, secrets, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        collectionId:
          type: string
          format: uuid
          description: Left out for sites at the top level.
        name:
          type: string
        protocol:
          type: string
          enum: [sftp, ftp, ftps]
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        authMethod:
          type: string
          enum: [password, key]
        listTimezone:
          type: string
          description: IANA zone in which the server prints listing times.
        charset:
          $ref: "#/components/schemas/Charset"
        secrets:
          type: array
          description: Kinds of secret stored for the site. The secrets themselves are never returned.
          items:
            type: string
            enum: [password, private_key, passphrase]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SiteInput:
      type: object
      required: [name, protocol, host, username]
      properties:
        collectionId:
          type: string
          format: uuid
          description: Collection to keep the site in; left out keeps it at the top level.
        name:
          type: string
        protocol:
          type: string
          enum: [sftp, ftp, ftps]
        host:
          type: string
        port:
          type: integer
          description: Defaults to the protocol's port.
        username:
          type: string
        authMethod:
          type: string
          enum: [password, key]
          description: Defaults to password; key is for SFTP only.
        listTimezone:
          type: string
          description: IANA zone of the server's listing times; defaults to UTC.
        charset:
          $ref: "#/components/schemas/Charset"
        password:
          type: string
          description: Write only. Left out keeps the stored one; an empty string removes it.
        privateKey:
          type: string
          description: Write only. Same rules as the password.
        passphrase:
          type: string
          description: Write only. Same rules as the password.
    KnownHost:
      type: object
      required: [host, port, keyType, fingerprint, firstSeen]
      properties:
        host:
          type: string
        port:
          type: integer
        keyType:
          type: string
        fingerprint:
          type: string
          description: SHA-256 fingerprint in OpenSSH notation.
        firstSeen:
          type: string
          format: date-time
    HostKeyInput:
      type: object
      required: [host, port, keyType, fingerprint]
      properties:
        host:
          type: string
        port:
          type: integer
        keyType:
          type: string
        fingerprint:
          type: string
    RemoteEntry:
      type: object
      required: [name, path, type, size, mode, modifiedAt, modifiedPrecision]
      properties:
        name:
          type: string
        path:
          type: string
        type:
          type: string
          enum: [file, directory, symlink, other]
        size:
          type: integer
          format: int64
        mode:
          type: string
          description: Permissions in the notation of ls, such as -rw-r--r--.
        modifiedAt:
          type: string
          format: date-time
          description: Modification time in UTC.
        modifiedPrecision:
          type: string
          enum: [second, minute, day]
          description: How exact modifiedAt is, since some servers only list the minute or the day.
    PathInput:
      type: object
      required: [path]
      properties:
        path:
          type: string
    RenameInput:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
        to:
          type: string
    TimeZoneProbe:
      type: object
      required: [exact, offsetMinutes]
      properties:
        exact:
          type: boolean
          description: The listing gives exact times in UTC, so no zone is needed.
        offsetMinutes:
          type: integer
          description: How far the times the server prints are from UTC, in minutes, rounded to a quarter of an hour.
        suggestedZone:
          type: string
          description: An IANA zone with that offset, when the offset is a whole number of hours.
    ImportItem:
      type: object
      required: [name, path, status, passwordStored, passwordSkipped]
      properties:
        name:
          type: string
        path:
          type: string
          description: The folders that hold the site, joined with slashes.
        status:
          type: string
          enum: [created, would_create, skipped, failed]
        reason:
          type: string
          description: Stable code that says why a site was skipped or failed.
        passwordStored:
          type: boolean
        passwordSkipped:
          type: boolean
          description: The file had a password that was not stored.
    ImportResult:
      type: object
      required: [dryRun, items]
      properties:
        dryRun:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/ImportItem"
    ActivityEntry:
      type: object
      required: [id, siteName, kind, path, at]
      properties:
        id:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
          description: Left out for a quick connection and once the site was deleted.
        siteName:
          type: string
          description: Name of the connection when it happened.
        kind:
          type: string
          enum: [mkdir, rename, delete, checksum, transfer]
        path:
          type: string
        detail:
          type: string
          description: The new path of a rename, the algorithm of a checksum, or the direction and final state of a transfer.
        errorCode:
          type: string
          description: Stable code of the failure; left out when the action worked.
        at:
          type: string
          format: date-time
    Checksum:
      type: object
      required: [algorithm, checksum, size]
      properties:
        algorithm:
          type: string
          enum: [md5, sha1, sha256, sha512]
        checksum:
          type: string
          description: The digest in lower case hexadecimal.
        size:
          type: integer
          format: int64
          description: Number of bytes that were read.
    CopyInput:
      type: object
      required: [sourceSiteId, sourcePath, targetSiteId, targetPath]
      properties:
        sourceSiteId:
          type: string
          format: uuid
          description: Saved site or quick connection to read from.
        sourcePath:
          type: string
        targetSiteId:
          type: string
          format: uuid
          description: Saved site or quick connection to write to.
        targetPath:
          type: string
          description: Full path of the copy, including its name.
        policy:
          type: string
          enum: [fail, overwrite, skip, newer, rename]
          description: >-
            What to do with a file that already exists at the destination: fail the copy (the default), overwrite it,
            skip it, overwrite it only when the source is newer, or keep both by giving the copy a free name such as
            "report (1).txt". Folders that exist are merged into.
        verify:
          type: boolean
          description: >-
            Read every copied file back and compare its SHA-256 with the bytes that were sent; a difference fails the transfer with
            checksum_mismatch. Defaults to false.
        transferId:
          type: string
          format: uuid
          description: Identifier for the transfer, chosen by the client. The server picks one when left out.
    Transfer:
      type: object
      required: [id, workspaceId, siteName, direction, path, name, status, bytesDone, attempts, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
          description: Left out once the site was deleted.
        siteName:
          type: string
        direction:
          type: string
          enum: [upload, download, copy]
        path:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [queued, running, done, failed, canceled, interrupted]
        totalBytes:
          type: integer
          format: int64
          description: Left out while the size is unknown.
        bytesDone:
          type: integer
          format: int64
          description: For an upload, where a resume continues.
        errorCode:
          type: string
          description: Stable code of the error that stopped the transfer.
        attempts:
          type: integer
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        paused:
          type: boolean
          description: True while a waiting transfer is held back by its user.
        priority:
          type: integer
          enum: [-1, 0, 1]
          description: Place in the queue of a waiting transfer, from low (-1) to high (1).
    TransferPriorityInput:
      type: object
      required: [priority]
      properties:
        priority:
          type: integer
          enum: [-1, 0, 1]
    Collection:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parentId:
          type: string
          format: uuid
          description: Left out for collections at the top level.
    CollectionInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        parentId:
          type: string
          format: uuid
          description: Left out to create at the top level.
    CollectionChanges:
      type: object
      properties:
        name:
          type: string
        parentId:
          type: string
          format: uuid
          description: Move under this collection.
        moveToTop:
          type: boolean
          description: Move to the top level; wins over parentId.
    QuickConnectInput:
      type: object
      required: [protocol, host, username]
      properties:
        protocol:
          type: string
          enum: [sftp, ftp, ftps]
        host:
          type: string
        port:
          type: integer
          description: Defaults to the protocol's port.
        username:
          type: string
        authMethod:
          type: string
          enum: [password, key]
        listTimezone:
          type: string
        charset:
          $ref: "#/components/schemas/Charset"
        password:
          type: string
          description: Write only; kept in memory until the connection ends.
        privateKey:
          type: string
          description: Write only; kept in memory until the connection ends.
        passphrase:
          type: string
          description: Write only; kept in memory until the connection ends.
    QuickConnection:
      type: object
      required: [id, name, protocol, host, port, username, authMethod, listTimezone, charset, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: The host.
        protocol:
          type: string
          enum: [sftp, ftp, ftps]
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        authMethod:
          type: string
          enum: [password, key]
        listTimezone:
          type: string
        charset:
          $ref: "#/components/schemas/Charset"
        createdAt:
          type: string
          format: date-time
    QuickSaveInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        collectionId:
          type: string
          format: uuid
          description: Collection to keep the site in; left out keeps it at the top level.
    Workspace:
      type: object
      required: [id, name, kind, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum: [personal, team]
        role:
          type: string
          enum: [owner, admin, editor, viewer]
          description: Role of the signed-in user in the workspace.
        createdAt:
          type: string
          format: date-time
    CreateWorkspaceInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Display name, 1 to 80 characters.
    Member:
      type: object
      required: [userId, email, role, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [owner, admin, editor, viewer]
        joinedAt:
          type: string
          format: date-time
    MemberRoleInput:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, editor, viewer]
    TransferInput:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
          description: Member who becomes the owner.
    InvitationInput:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
        role:
          type: string
          enum: [admin, editor, viewer]
    Invitation:
      type: object
      required: [id, email, role, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [admin, editor, viewer]
        invitedBy:
          type: string
          description: Email of the member who invited; left out when that account no longer exists.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    InvitationCreated:
      type: object
      required: [invitation, token]
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        token:
          type: string
          description: Secret of the invitation, shown only here. The link is the app address with /invite#token.
    InvitationToken:
      type: object
      required: [token]
      properties:
        token:
          type: string
    InvitationJoinInput:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
    InvitationPreview:
      type: object
      required: [workspaceName, email, role, expiresAt, accountExists]
      properties:
        workspaceName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, editor, viewer]
        invitedBy:
          type: string
        expiresAt:
          type: string
          format: date-time
        accountExists:
          type: boolean
          description: Whether the invited address already has an account, so the client offers sign-in or sign-up.
    Preferences:
      type: object
      properties:
        locale:
          type: string
          description: BCP 47 language tag of the interface.
        timezone:
          type: string
          description: IANA time zone name.
        theme:
          type: string
          description: Identifier of the interface theme, such as sentinel-dark or monokai. Lower case letters, digits and hyphens, up to 40. The clients know the themes.
    User:
      type: object
      required: [id, email, role, locale, timezone, theme]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [admin, user]
        locale:
          type: string
        timezone:
          type: string
        theme:
          type: string
    SessionInfo:
      type: object
      required: [user, csrfToken]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string
          description: Send it as X-CSRF-Token on state-changing requests.
