    put:
      operationId: uploadFile
      security:
        - sessionCookie: []
      summary: Upload a file
      description: The body is streamed to a "<path>.part" file with no size limit, which takes the place of path only once it is complete; path itself is never partially written. If an upload is interrupted the ".part" file stays there, and a request with mode=resume and the size of that file (found by getting "<path>.part") as offset completes it.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/RemotePath"
        - name: mode
          in: query
          required: false
          description: What to do when the file exists. create refuses, overwrite replaces, resume continues at offset.
          schema:
            type: string
            enum: [create, overwrite, resume]
            default: create
        - name: offset
          in: query
          required: false
          description: Byte to continue at; only valid with mode=resume and not beyond the size of the file.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - $ref: "#/components/parameters/TransferIdQuery"
        - name: size
          in: query
          required: false
          description: Expected number of bytes, for progress; informational only.
          schema:
            type: integer
            format: int64
            minimum: 0
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The file after the upload.
