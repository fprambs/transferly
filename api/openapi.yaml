    post:
      operationId: importTransferly
      security:
        - sessionCookie: []
      summary: Import a file exported by Transferly
      description: >-
        Opens a file of exportSites with its password and creates its collections and sites as the FileZilla import does: dry run,
        conflict policy, target collection and one result per site. A wrong password or a changed file is wrong_export_password, a file
        that is not an export is invalid_export, and one over 4 MiB is import_file_too_large. Secrets are stored only when asked for and
        need the vault unlocked.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/CsrfToken"
        - name: dryRun
          in: query
          required: false
          description: Only report what would happen.
          schema:
            type: boolean
        - name: secrets
          in: query
          required: false
          description: Store the secrets of the file in the vault.
          schema:
            type: boolean
        - name: onConflict
          in: query
          required: false
          description: What to do with a site whose name is taken. Skip by default.
          schema:
            type: string
            enum: [skip, rename]
        - name: collectionId
          in: query
          required: false
          description: Collection that receives everything; the top level when left out.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferlyImport"
      responses:
        "200":
          description: What happened, or would happen, to each site of the file.
