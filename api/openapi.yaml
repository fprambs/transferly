    post:
      operationId: importFilezilla
      security:
        - sessionCookie: []
      summary: Import the site manager of FileZilla
      description: >-
        Reads a sitemanager.xml sent as the body and creates its folders and sites. Sites are independent: one that cannot be created
        does not stop the others. A dry run answers what would happen and writes nothing. Passwords are stored only when asked for and
        need the vault to be unlocked. The file is limited to 4 MiB and may not carry a document type definition.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/CsrfToken"
        - name: dryRun
          in: query
          required: false
          description: Only report what would happen.
          schema:
            type: boolean
        - name: passwords
          in: query
          required: false
          description: Store the passwords of the file in the vault.
          schema:
            type: boolean
        - name: onConflict
          in: query
          required: false
          description: What to do with a site whose name is taken. Skip by default.
          schema:
            type: string
            enum: [skip, rename]
        - name: collectionId
          in: query
          required: false
          description: Collection that receives everything; the top level when left out.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/FileZillaMasterPassword"
      requestBody:
        required: true
        content:
          application/xml:
            schema:
