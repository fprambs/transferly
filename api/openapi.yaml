openapi: 3.1.0
info:
  title: Sentinel API
  version: 0.1.0
  description: HTTP API of the Sentinel file transfer client.
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      summary: Liveness probe
      description: Answers while the process is alive; it never checks dependencies.
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: getReadiness
      security: []
      summary: Readiness probe
      description: Checks that the backend and its dependencies can serve traffic.
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: A dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /api/v1/setup/status:
    get:
      operationId: getSetupStatus
      summary: Whether the first administrator still has to be created
      security: []
      responses:
        "200":
          description: The setup state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /api/v1/setup:
    post:
      operationId: setup
      summary: Create the first administrator and sign in
      description: Only works while no account exists. Rate limited per client address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "201":
          description: Administrator created and signed in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "409":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Sign in
      description: Rate limited per client address and per account. Wrong emails and wrong passwords are indistinguishable.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "202":
          description: The password was right but the account has a second factor. No session exists yet; the challenge goes to /auth/mfa with a code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaChallenge"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/logout:
    post:
      operationId: logout
      security:
        - sessionCookie: []
      summary: Sign out
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Signed out; the session cookie is cleared.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/me:
    get:
      operationId: getMe
      security:
        - sessionCookie: []
      summary: The signed-in user and the anti-CSRF token of the session
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      operationId: updateMe
      security:
        - sessionCookie: []
      summary: Change the interface language and time zone
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Preferences"
      responses:
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      security:
        - sessionCookie: []
      summary: Workspaces the signed-in user belongs to, with their role in each
      responses:
        "200":
          description: The workspaces, personal first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: createWorkspace
      security:
        - sessionCookie: []
      summary: Create a team workspace owned by the signed-in user
      description: >-
        Needs the vault unlocked (409 vault_locked), because the workspace gets a key of its own sealed with the public key of its
        owner, whose key pair is created on the way when it does not exist yet.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceInput"
      responses:
        "201":
          description: The workspace was created and the caller is its owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/workspaces/{workspaceId}:
    get:
      operationId: getWorkspace
      security:
        - sessionCookie: []
      summary: One workspace of the signed-in user
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: The workspace and the role of the user in it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/workspaces/{workspaceId}/members:
    get:
      operationId: listMembers
      security:
        - sessionCookie: []
      summary: Members of a team workspace
      description: >-
        Any member may read the list. Personal workspaces have no members to list and answer 409 personal_workspace. When the caller has
        the vault unlocked and holds the workspace key, it is first sealed for the members that have set up their vault since.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: The members, the owner first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/workspaces/{workspaceId}/members/{userId}:
    patch:
      operationId: setMemberRole
      security:
        - sessionCookie: []
      summary: Change the role of a member
      description: >-
        Needs manage_members. The caller can only give roles below their own and only change members ranked below them, so an admin
        manages editors and viewers and the owner also manages admins. The owner cannot be changed: transfer ownership instead.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRoleInput"
      responses:
        "204":
          description: The role was changed.
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: removeMember
      security:
        - sessionCookie: []
      summary: Remove a member from a team workspace
      description: Needs manage_members and a role above the member's. The owner cannot be removed.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: The member was removed.
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/workspaces/{workspaceId}/leave:
    post:
      operationId: leaveWorkspace
      security:
        - sessionCookie: []
      summary: Leave a team workspace
      description: The owner cannot leave; ownership has to be transferred first.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: The caller is no longer a member.
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/workspaces/{workspaceId}/transfer:
    post:
      operationId: transferOwnership
      security:
        - sessionCookie: []
      summary: Hand a team workspace to another member
      description: Only the owner may do it. The previous owner becomes an admin.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferInput"
      responses:
        "204":
          description: Ownership changed hands.
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/workspaces/{workspaceId}/invitations:
    get:
      operationId: listInvitations
      security:
        - sessionCookie: []
      summary: Invitations waiting in a team workspace
      description: Needs manage_members. Used, revoked and expired invitations are not listed.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: The pending invitations, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: createInvitation
      security:
        - sessionCookie: []
      summary: Invite an email address to a team workspace
      description: >-
        Needs manage_members and a role above the invited one. The reply carries the token once; only its hash is stored.
        Inviting an address that already has a pending invitation replaces it. Sentinel sends no email: the caller shares the link.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201":
          description: The invitation and its token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCreated"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/workspaces/{workspaceId}/invitations/{invitationId}:
    delete:
      operationId: revokeInvitation
      security:
        - sessionCookie: []
      summary: Revoke an invitation
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/InvitationId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: The invitation no longer works.
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/invitations/preview:
    post:
      operationId: previewInvitation
      security: []
      summary: See what an invitation offers
      description: >-
        For the holder of a token, before signing in. Every failure (unknown, used, revoked or expired) is the same 404 invitation_not_found.
        Rate limited per client address. The token travels in the body so it never reaches an access log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationToken"
      responses:
        "200":
          description: The invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      security:
        - sessionCookie: []
      summary: Join a team workspace with the signed-in account
      description: The account must have the invited email address; any other account gets 404 invitation_not_found. Rate limited per client address.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationToken"
      responses:
        "200":
          description: The caller is a member; the workspace is returned with their role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/invitations/join:
    post:
      operationId: joinWithInvitation
      security: []
      summary: Create the invited account and join
      description: >-
        The only way to sign up: it needs a valid invitation and creates the account with its email address. An address that already has
        an account answers 409 account_exists and the invitee signs in and accepts instead. Rate limited per client address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationJoinInput"
      responses:
        "201":
          description: Account created, member of the workspace and signed in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/workspaces/{workspaceId}/audit:
    get:
      operationId: listAudit
      security:
        - sessionCookie: []
      summary: The audit trail of a workspace
      description: >-
        What changed in the workspace and who did it: members, roles, invitations, sites, keys and trusted servers. Needs manage_members.
        The trail never holds credentials, keys or file contents.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: action
          in: query
          required: false
          description: Keep the events whose action starts with this text, such as `member.` or `site.created`.
          schema:
            type: string
        - name: before
          in: query
          required: false
          description: Keep the events older than this identifier, to read the next page.
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          description: How many to return, 100 by default and at most 500.
          schema:
            type: integer
      responses:
        "200":
          description: The events, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/admin/users:
    get:
      operationId: listAdminUsers
      security:
        - sessionCookie: []
      summary: The accounts of the instance
      description: Needs the administrator role of the instance.
      responses:
        "200":
          description: Every account, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
