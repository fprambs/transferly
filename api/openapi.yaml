openapi: 3.1.0
info:
  title: Sentinel API
  version: 0.1.0
  description: HTTP API of the Sentinel file transfer client.
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      summary: Liveness probe
      description: Answers while the process is alive; it never checks dependencies.
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: getReadiness
      security: []
      summary: Readiness probe
      description: Checks that the backend and its dependencies can serve traffic.
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: A dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /api/v1/setup/status:
    get:
      operationId: getSetupStatus
      summary: Whether the first administrator still has to be created
      security: []
      responses:
        "200":
          description: The setup state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /api/v1/setup:
    post:
      operationId: setup
      summary: Create the first administrator and sign in
      description: Only works while no account exists. Rate limited per client address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "201":
          description: Administrator created and signed in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "409":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Sign in
      description: Rate limited per client address and per account. Wrong emails and wrong passwords are indistinguishable.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/logout:
    post:
      operationId: logout
      security:
        - sessionCookie: []
      summary: Sign out
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Signed out; the session cookie is cleared.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/me:
    get:
      operationId: getMe
      security:
        - sessionCookie: []
      summary: The signed-in user and the anti-CSRF token of the session
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      operationId: updateMe
      security:
        - sessionCookie: []
      summary: Change the interface language and time zone
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Preferences"
      responses:
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      security:
        - sessionCookie: []
      summary: Workspaces the signed-in user belongs to, with their role in each
      responses:
        "200":
          description: The workspaces, personal first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/workspaces/{workspaceId}:
    get:
      operationId: getWorkspace
      security:
        - sessionCookie: []
      summary: One workspace of the signed-in user
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: The workspace and the role of the user in it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/vault:
    get:
      operationId: getVault
      summary: State of the vault in this session
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Whether the vault exists and is unlocked in this session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultStatus"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/vault/setup:
    post:
      operationId: setupVault
      summary: Create the vault and unlock it
      description: The recovery kit in the response is shown once and never stored; without it a lost master password loses every secret.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MasterPasswordRequest"
      responses:
        "201":
          description: Vault created and unlocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryKit"
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/vault/unlock:
    post:
      operationId: unlockVault
      summary: Unlock the vault for this session
      description: Rate limited per account.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MasterPasswordRequest"
      responses:
        "204":
          description: Vault unlocked.
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/vault/lock:
    post:
      operationId: lockVault
      summary: Lock the vault for this session
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Vault locked.
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/vault/password:
    post:
      operationId: changeMasterPassword
      summary: Change the master password
      description: Needs the current one. Rate limited per account.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeMasterPasswordRequest"
      responses:
        "204":
          description: Master password changed; the session stays unlocked.
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/vault/recover:
    post:
      operationId: recoverVault
      summary: Set a new master password with the recovery kit
      description: Unlocks the vault for this session. Rate limited per account.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoverVaultRequest"
      responses:
        "204":
          description: Master password replaced; the session is unlocked.
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/vault/recovery-kit:
    post:
      operationId: regenerateRecoveryKit
      summary: Replace the recovery kit
      description: Needs the master password; the previous kit stops working. Rate limited per account.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MasterPasswordRequest"
      responses:
        "200":
          description: The new recovery kit, shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryKit"
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/workspaces/{workspaceId}/sites:
    get:
      operationId: listSites
      security:
        - sessionCookie: []
      summary: Sites of a workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: The sites by name, with the kinds of secret stored but never the secrets.
          content:
            application/json:
              schema:
                type: array
                items:
                    $ref: "#/components/schemas/Site"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: createSite
      security:
        - sessionCookie: []
      summary: Save a site
      description: Writing secrets needs the vault unlocked in the session. Hosts on private networks are refused unless the administrator allowed them.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteInput"
      responses:
        "201":
          description: The saved site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/workspaces/{workspaceId}/sites/{siteId}:
    get:
      operationId: getSite
      security:
        - sessionCookie: []
      summary: One site
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: The site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      operationId: updateSite
      security:
        - sessionCookie: []
      summary: Change a site
      description: Secrets left out stay as they are, an empty string removes one and any other value replaces it.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteInput"
      responses:
        "200":
          description: The updated site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deleteSite
      security:
        - sessionCookie: []
      summary: Delete a site and its secrets
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Deleted.
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/workspaces/{workspaceId}/known-hosts:
    get:
      operationId: listKnownHosts
      security:
        - sessionCookie: []
      summary: Server keys trusted in a workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: The trusted keys by host, port and type.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnownHost"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: trustHostKey
      security:
        - sessionCookie: []
      summary: Trust a server key
      description: Records the key a user saw and confirmed. A different key of the same type must be forgotten first.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostKeyInput"
      responses:
        "201":
          description: The trusted key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnownHost"
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: forgetHostKey
      security:
        - sessionCookie: []
      summary: Forget a trusted key, so the next connection asks again
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/CsrfToken"
        - name: host
          in: query
          required: true
          description: Server name or address.
          schema:
            type: string
        - name: port
          in: query
          required: true
          description: Server port.
          schema:
            type: integer
        - name: keyType
          in: query
          required: true
          description: Key algorithm, such as ssh-ed25519.
          schema:
            type: string
      responses:
        "204":
          description: Forgotten.
        "400":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An error. The stable code tells the client what happened.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sentinel_session
      description: Opaque session token set by login and setup. State-changing requests also need the X-CSRF-Token header.
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Anti-CSRF token returned with the session and bound to it. Mandatory on state-changing requests of signed-in users; the server answers 403 csrf_invalid without it.
      schema:
        type: string
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Identifier of the workspace.
      schema:
        type: string
        format: uuid
    SiteId:
      name: siteId
      in: path
      required: true
      description: Identifier of the site.
      schema:
        type: string
        format: uuid
  headers:
    SetCookie:
      description: Sets or clears the session cookie (HttpOnly, SameSite=Lax, Secure over https).
      schema:
        type: string
  responses:
    RateLimited:
      description: Too many attempts; retry after the indicated time.
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    HealthStatus:
      type: object
      description: Status reported by a health endpoint.
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Problem:
      type: object
      description: RFC 9457 problem document returned on errors.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: URI reference identifying the problem type; about:blank when generic.
        title:
          type: string
          description: Fixed English summary meant for logs, never for display.
        status:
          type: integer
          description: HTTP status code.
        code:
          type: string
          description: Stable machine-readable code that clients translate.
        params:
          type: object
          additionalProperties: true
          description: Values used to fill the translated message.
    SetupStatus:
      type: object
      required: [required]
      properties:
        required:
          type: boolean
          description: True until the first administrator exists.
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          description: Sent to the server only; never returned.
    VaultStatus:
      type: object
      required: [initialized, unlocked]
      properties:
        initialized:
          type: boolean
        unlocked:
          type: boolean
    MasterPasswordRequest:
      type: object
      required: [masterPassword]
      properties:
        masterPassword:
          type: string
          description: Sent to the server only; never returned.
    ChangeMasterPasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    RecoverVaultRequest:
      type: object
      required: [recoveryKit, newPassword]
      properties:
        recoveryKit:
          type: string
        newPassword:
          type: string
    RecoveryKit:
      type: object
      required: [recoveryKit]
      properties:
        recoveryKit:
          type: string
          description: Key that recovers the vault when the master password is lost. Shown once.
    Site:
      type: object
      required: [id, name, protocol, host, port, username, authMethod, listTimezone, secrets, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        protocol:
          type: string
          enum: [sftp, ftp, ftps]
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        authMethod:
          type: string
          enum: [password, key]
        listTimezone:
          type: string
          description: IANA zone in which the server prints listing times.
        secrets:
          type: array
          description: Kinds of secret stored for the site. The secrets themselves are never returned.
          items:
            type: string
            enum: [password, private_key, passphrase]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SiteInput:
      type: object
      required: [name, protocol, host, username]
      properties:
        name:
          type: string
        protocol:
          type: string
          enum: [sftp, ftp, ftps]
        host:
          type: string
        port:
          type: integer
          description: Defaults to the protocol's port.
        username:
          type: string
        authMethod:
          type: string
          enum: [password, key]
          description: Defaults to password; key is for SFTP only.
        listTimezone:
          type: string
          description: IANA zone of the server's listing times; defaults to UTC.
        password:
          type: string
          description: Write only. Left out keeps the stored one; an empty string removes it.
        privateKey:
          type: string
          description: Write only. Same rules as the password.
        passphrase:
          type: string
          description: Write only. Same rules as the password.
    KnownHost:
      type: object
      required: [host, port, keyType, fingerprint, firstSeen]
      properties:
        host:
          type: string
        port:
          type: integer
        keyType:
          type: string
        fingerprint:
          type: string
          description: SHA-256 fingerprint in OpenSSH notation.
        firstSeen:
          type: string
          format: date-time
    HostKeyInput:
      type: object
      required: [host, port, keyType, fingerprint]
      properties:
        host:
          type: string
        port:
          type: integer
        keyType:
          type: string
        fingerprint:
          type: string
    Workspace:
      type: object
      required: [id, name, kind, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum: [personal, team]
        role:
          type: string
          enum: [owner, admin, editor, viewer]
          description: Role of the signed-in user in the workspace.
        createdAt:
          type: string
          format: date-time
    Preferences:
      type: object
      properties:
        locale:
          type: string
          description: BCP 47 language tag of the interface.
        timezone:
          type: string
          description: IANA time zone name.
    User:
      type: object
      required: [id, email, role, locale, timezone]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [admin, user]
        locale:
          type: string
        timezone:
          type: string
    SessionInfo:
      type: object
      required: [user, csrfToken]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string
          description: Send it as X-CSRF-Token on state-changing requests.
