components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sentinel_session
      description: Opaque session token set by login and setup. State-changing requests also need the X-CSRF-Token header.
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Anti-CSRF token returned with the session and bound to it. Mandatory on state-changing requests of signed-in users; the server answers 403 csrf_invalid without it.
      schema:
        type: string
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Identifier of the workspace.
      schema:
        type: string
        format: uuid
    SiteId:
      name: siteId
      in: path
      required: true
      description: Identifier of the site.
      schema:
        type: string
        format: uuid
    RemotePath:
      name: path
      in: query
      required: true
      description: Path on the remote server.
      schema:
        type: string
    TransferId:
      name: transferId
      in: path
      required: true
      description: Identifier of the transfer.
      schema:
        type: string
        format: uuid
    TransferIdQuery:
      name: transferId
      in: query
      required: false
      description: Identifier the client chose for this transfer, to follow it and to resume it; a new one is generated when left out.
      schema:
        type: string
        format: uuid
    CollectionId:
      name: collectionId
      in: path
      required: true
      description: Identifier of the collection.
      schema:
        type: string
        format: uuid
  headers:
    SetCookie:
      description: Sets or clears the session cookie (HttpOnly, SameSite=Lax, Secure over https).
      schema:
        type: string
  responses:
    RateLimited:
      description: Too many attempts; retry after the indicated time.
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    HealthStatus:
      type: object
      description: Status reported by a health endpoint.
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Problem:
      type: object
      description: RFC 9457 problem document returned on errors.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: URI reference identifying the problem type; about:blank when generic.
        title:
          type: string
          description: Fixed English summary meant for logs, never for display.
        status:
          type: integer
          description: HTTP status code.
        code:
          type: string
          description: Stable machine-readable code that clients translate.
        params:
          type: object
          additionalProperties: true
          description: Values used to fill the translated message.
    SetupStatus:
      type: object
      required: [required]
      properties:
        required:
          type: boolean
          description: True until the first administrator exists.
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          description: Sent to the server only; never returned.
    VaultStatus:
      type: object
      required: [initialized, unlocked]
      properties:
        initialized:
          type: boolean
        unlocked:
          type: boolean
    MasterPasswordRequest:
      type: object
      required: [masterPassword]
      properties:
        masterPassword:
          type: string
          description: Sent to the server only; never returned.
    ChangeMasterPasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    RecoverVaultRequest:
      type: object
      required: [recoveryKit, newPassword]
      properties:
        recoveryKit:
          type: string
        newPassword:
          type: string
    RecoveryKit:
      type: object
      required: [recoveryKit]
      properties:
        recoveryKit:
          type: string
          description: Key that recovers the vault when the master password is lost. Shown once.
    Site:
      type: object
      required: [id, name, protocol, host, port, username, authMethod, listTimezone, secrets, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        collectionId:
          type: string
          format: uuid
          description: Left out for sites at the top level.
        name:
          type: string
        protocol:
          type: string
          enum: [sftp, ftp, ftps]
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        authMethod:
          type: string
          enum: [password, key]
        listTimezone:
          type: string
          description: IANA zone in which the server prints listing times.
        secrets:
          type: array
          description: Kinds of secret stored for the site. The secrets themselves are never returned.
          items:
            type: string
            enum: [password, private_key, passphrase]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SiteInput:
      type: object
      required: [name, protocol, host, username]
      properties:
        collectionId:
          type: string
          format: uuid
          description: Collection to keep the site in; left out keeps it at the top level.
        name:
          type: string
        protocol:
          type: string
          enum: [sftp, ftp, ftps]
        host:
          type: string
        port:
          type: integer
          description: Defaults to the protocol's port.
        username:
          type: string
        authMethod:
          type: string
          enum: [password, key]
          description: Defaults to password; key is for SFTP only.
        listTimezone:
          type: string
          description: IANA zone of the server's listing times; defaults to UTC.
        password:
          type: string
          description: Write only. Left out keeps the stored one; an empty string removes it.
        privateKey:
          type: string
          description: Write only. Same rules as the password.
        passphrase:
          type: string
          description: Write only. Same rules as the password.
    KnownHost:
      type: object
      required: [host, port, keyType, fingerprint, firstSeen]
      properties:
        host:
          type: string
        port:
          type: integer
        keyType:
          type: string
        fingerprint:
          type: string
          description: SHA-256 fingerprint in OpenSSH notation.
        firstSeen:
          type: string
          format: date-time
    HostKeyInput:
      type: object
      required: [host, port, keyType, fingerprint]
      properties:
        host:
          type: string
        port:
          type: integer
        keyType:
          type: string
        fingerprint:
          type: string
    RemoteEntry:
      type: object
      required: [name, path, type, size, mode, modifiedAt, modifiedPrecision]
      properties:
        name:
          type: string
        path:
          type: string
        type:
          type: string
          enum: [file, directory, symlink, other]
        size:
          type: integer
          format: int64
        mode:
          type: string
          description: Permissions in the notation of ls, such as -rw-r--r--.
        modifiedAt:
          type: string
          format: date-time
          description: Modification time in UTC.
        modifiedPrecision:
          type: string
          enum: [second, minute, day]
          description: How exact modifiedAt is, since some servers only list the minute or the day.
    PathInput:
      type: object
      required: [path]
      properties:
        path:
          type: string
    RenameInput:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
        to:
          type: string
    Transfer:
      type: object
      required: [id, workspaceId, siteName, direction, path, name, status, bytesDone, attempts, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
          description: Left out once the site was deleted.
        siteName:
          type: string
        direction:
          type: string
          enum: [upload, download]
        path:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [queued, running, done, failed, canceled, interrupted]
        totalBytes:
          type: integer
          format: int64
          description: Left out while the size is unknown.
        bytesDone:
          type: integer
          format: int64
          description: For an upload, where a resume continues.
        errorCode:
          type: string
          description: Stable code of the error that stopped the transfer.
        attempts:
          type: integer
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    Collection:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parentId:
          type: string
          format: uuid
          description: Left out for collections at the top level.
    CollectionInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        parentId:
          type: string
          format: uuid
          description: Left out to create at the top level.
    CollectionChanges:
      type: object
      properties:
        name:
          type: string
        parentId:
          type: string
          format: uuid
          description: Move under this collection.
        moveToTop:
          type: boolean
          description: Move to the top level; wins over parentId.
    Workspace:
      type: object
      required: [id, name, kind, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum: [personal, team]
        role:
          type: string
          enum: [owner, admin, editor, viewer]
          description: Role of the signed-in user in the workspace.
        createdAt:
          type: string
          format: date-time
    Preferences:
      type: object
      properties:
        locale:
          type: string
          description: BCP 47 language tag of the interface.
        timezone:
          type: string
          description: IANA time zone name.
    User:
      type: object
      required: [id, email, role, locale, timezone]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [admin, user]
        locale:
          type: string
        timezone:
          type: string
    SessionInfo:
      type: object
      required: [user, csrfToken]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string
          description: Send it as X-CSRF-Token on state-changing requests.
