name: transferly-audit
services:
  secrets:
    image: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
      - /tmp/transferly-audit:/reports
    command: ["git", "--redact", "--report-format", "json", "--report-path", "/reports/secrets.json", "--log-opts=--all", "/workspace"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  trivy:
    image: aquasec/trivy:0.74.0
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
      - /tmp/transferly-audit:/reports
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:mode=1777
